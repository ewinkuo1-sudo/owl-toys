<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦉 Owl Toys</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14161c; --panel: #1d2028; --ink: #e6e6ec; --muted: #9aa0ae;
    --dim: #4a4f5c; --grid: #2e3340; --accent: #6ec6ff;
    --card-shadow: none; --card-shadow-hover: none;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f2f3f6; --panel: #ffffff; --ink: #1c1f27; --muted: #5b6272;
    --dim: #8b91a0; --grid: #dfe2e9; --accent: #1e6fc0;
    --card-shadow: 0 1px 3px rgba(20,24,40,0.06);
    --card-shadow-hover: 0 3px 10px rgba(20,24,40,0.10);
  }
  body {
    margin: 0; min-height: 100vh; padding: 48px 24px;
    background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  h1 { font-size: 1.6rem; margin: 0; }
  p.sub { color: var(--muted); margin: 0 0 24px; font-size: 0.9rem; text-align: center; }
  a.card {
    display: block; width: min(560px, 100%);
    background: var(--panel); border-radius: 12px; padding: 18px 20px;
    text-decoration: none; color: inherit; margin-bottom: 12px;
    border: 1px solid var(--grid); box-shadow: var(--card-shadow);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  a.card:hover { border-color: var(--accent); box-shadow: var(--card-shadow-hover); }
  .card h2 { margin: 0 0 6px; font-size: 1.05rem; color: var(--accent); }
  .card p { margin: 0; font-size: 0.85rem; color: var(--muted); line-height: 1.6; }
  footer { margin-top: auto; padding-top: 32px; color: var(--dim); font-size: 0.78rem; }
  .chips { position: fixed; top: 14px; right: 16px; z-index: 5; display: flex; gap: 6px; }
  button.chip {
    background: var(--panel); color: var(--muted); border: 1px solid var(--grid);
    border-radius: 8px; padding: 5px 9px; font-size: 0.78rem; cursor: pointer;
    font-family: inherit; line-height: 1.2; transition: border-color .12s, color .12s;
  }
  button.chip:hover { border-color: var(--muted); color: var(--ink); }
</style>
</head>
<body>
<script>
// 先套主題，避免首繪閃白／閃黑（完整邏輯在頁尾）
(() => {
  let th = 'light'; try { th = localStorage.getItem('owl-theme') || th; } catch (e) {}
  const q = new URLSearchParams(location.search).get('theme');
  if (q === 'dark' || q === 'light') th = q;
  document.documentElement.dataset.theme = th;
})();
</script>

  點任何零件跳出中英文說明與規格，切雷射（405/488，543/633 預留）、pinhole 段位、濾片組合、掃描速度、Z 軸位置，看切片厚度、雜訊與影像跟著變。`,

  疊上螢光壽命低通，看 NADH 的 1f/2f 取頻取捨——訊號虧 1.4 倍、相位差 26°→40°。`,
},
en: {
  'title': '🦉 Owl Toys',

  'btn.lang.title': '切換為中文',
  'btn.theme.title': 'Toggle dark / light',
  'theme.light': '☀ Light', 'theme.dark': '🌙 Dark',

  'card.flim.desc': `Take one harmonic of the TCSPC decay histogram and you get a phasor: single exponentials sit on the semicircle, mixtures on the chord;

  'card.comb.title': 'Pulse Train ↔ Frequency Comb',
  'card.comb.desc': `A periodic pulse train is a frequency comb. Drag the repetition rate, pulse width and number of summed harmonics to see how a sharp pulse grows out of sine waves;

};
let LANG = 'zh';
const t = (k, ...a) => { const v = (I18N[LANG][k] ?? I18N.zh[k]); return typeof v === 'function' ? v(...a) : (v ?? k); };

// ═══════════════════════════ 主題 / Theme ═══════════════════════════
function setTheme(th) {
  document.documentElement.dataset.theme = th;
  try { localStorage.setItem('owl-theme', th); } catch (e) {}
  $('theme').textContent = th === 'dark' ? t('theme.light') : t('theme.dark');
}
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

// ═══════════════════════════ 語言 / Language ═══════════════════════════
function applyLang() {
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-TW';
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  $('lang').textContent = LANG === 'en' ? '中文' : 'EN';
  $('theme').textContent = document.documentElement.dataset.theme === 'dark' ? t('theme.light') : t('theme.dark');
}
function setLang(l) {
  LANG = l === 'en' ? 'en' : 'zh';
  try { localStorage.setItem('owl-lang', LANG); } catch (e) {}
  applyLang();
}
(() => {
  let l = 'zh'; try { l = localStorage.getItem('owl-lang') || l; } catch (e) {}
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'en' || q === 'zh') l = q;
  LANG = l;
})();
$('lang').onclick = () => setLang(LANG === 'en' ? 'zh' : 'en');

setTheme(document.documentElement.dataset.theme || 'light');
applyLang();
</script>
</body>
