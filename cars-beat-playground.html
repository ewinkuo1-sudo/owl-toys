<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARS 拍頻遊樂場 🦉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14161c;
    --panel: #1d2028;
    --panel2: #232733;
    --ink: #e6e6ec;
    --muted: #9aa0ae;
    --dim: #6b7180;
    --accent: #6ec6ff;
    --ref: #ffb86c;
    --grid: #2e3340;
    --as: #b18cff;
    --srs: #6ee7a0;
    --on-ink: #14161c;
    --panel-rgb: 29,32,40;
    --ink-rgb: 230,230,236;
    --muted-rgb: 154,160,174;
    --accent-rgb: 110,198,255;
    --ref-rgb: 255,184,108;
    --as-rgb: 177,140,255;
    --fluo-a: 0.16; --fluo-b: 0.02;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f2f3f6;
    --panel: #ffffff;
    --panel2: #eceef3;
    --ink: #1c1f27;
    --muted: #5b6272;
    --dim: #8b91a0;
    --accent: #1e6fc0;
    --ref: #d4741a;
    --grid: #dfe2e9;
    --as: #7648cf;
    --srs: #1f8f55;
    --on-ink: #ffffff;
    --panel-rgb: 255,255,255;
    --ink-rgb: 28,31,39;
    --muted-rgb: 91,98,114;
    --accent-rgb: 30,111,192;
    --ref-rgb: 212,116,26;
    --as-rgb: 118,72,207;
    --fluo-a: 0.20; --fluo-b: 0.03;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 40px;
    background: var(--bg); color: var(--ink);
    font-family: "Noto Serif TC", "Source Han Serif TC", "Songti TC", serif;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  h1 { font-size: 1.25rem; margin: 0; font-weight: 600; letter-spacing: 0.01em; }
  .sub { color: var(--muted); font-size: 0.85rem; margin: 0; max-width: 760px; text-align: center; line-height: 1.7; }
  .sub b { color: var(--ink); font-weight: 600; }
  .m { font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; font-style: italic; color: var(--ink); font-size: 1.02em; }
  .m sub { font-style: normal; font-size: 0.72em; }
  .wrap { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; align-items: flex-start; width: 100%; max-width: 940px; }
  .stack { display: flex; flex-direction: column; gap: 14px; flex: 1 1 560px; min-width: 0; }
  canvas { background: var(--panel); border-radius: 12px; display: block; max-width: 100%; height: auto; }
  :root[data-theme="light"] canvas, :root[data-theme="light"] .controls, :root[data-theme="light"] .card { box-shadow: 0 1px 3px rgba(20,24,40,0.06); }
  .controls {
    background: var(--panel); border-radius: 12px; padding: 18px 18px 16px;
    display: flex; flex-direction: column; gap: 16px; flex: 0 0 300px; max-width: 320px;
  }
  .ctl label { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.88rem; margin-bottom: 6px; gap: 8px; }
  .ctl label span { white-space: nowrap; }
  .ctl output { color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ctl .row2 { display: flex; gap: 8px; align-items: center; }
  .ctl .row2 input[type=range] { flex: 1; }
  .ctl .row2 button { flex: none; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  button.chip, .presets button {
    background: none; color: var(--muted); border: 1px solid var(--grid);
    border-radius: 8px; padding: 5px 9px; font-size: 0.78rem; cursor: pointer;
    font-family: inherit; line-height: 1.2; transition: border-color .12s, color .12s;
  }
  .presets button:hover, button.chip:hover { border-color: var(--muted); color: var(--ink); }
  .presets button.on { color: var(--on-ink); background: var(--ref); border-color: var(--ref); font-weight: 600; }
  #modes button.on { background: var(--accent); border-color: var(--accent); }
  .presets button small { display: block; font-size: 0.68rem; opacity: 0.75; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--muted); }
  .toggle input { accent-color: var(--ref); margin: 0; }
  .head { display: flex; justify-content: space-between; align-items: center; }
  .head .title { font-size: 0.88rem; }
  .head .btns { display: flex; gap: 6px; }
  .stats { font-size: 0.82rem; color: var(--muted); border-top: 1px solid var(--grid); padding-top: 12px; display: grid; gap: 4px; }
  .stats h4 { margin: 8px 0 2px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; color: var(--dim); text-transform: uppercase; }
  .stats h4:first-child { margin-top: 0; }
  .stats .r { display: flex; justify-content: space-between; gap: 10px; line-height: 1.5; }
  .stats .r b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .stats .r.hi b { color: var(--accent); }
  .stats .note { font-size: 0.76rem; line-height: 1.55; color: var(--muted); margin-top: 4px; }
  .notes { width: 100%; max-width: 940px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--panel); border-radius: 12px; padding: 18px 20px; font-size: 0.84rem; line-height: 1.75; color: var(--muted); }
  .card h3 { margin: 0 0 8px; font-size: 0.95rem; color: var(--ink); font-weight: 600; }
  .card p { margin: 0 0 10px; }
  .card p:last-child { margin-bottom: 0; }
  .card b { color: var(--ink); font-weight: 600; }
  .card details summary { cursor: pointer; color: var(--ink); font-weight: 600; font-size: 0.95rem; }
  .card details[open] summary { margin-bottom: 8px; }
  .tblwrap { overflow-x: auto; }
  table.cmp { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 0.82rem; }
  table.cmp th, table.cmp td { padding: 7px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; text-align: left; line-height: 1.55; }
  table.cmp th { color: var(--ink); font-weight: 600; white-space: nowrap; }
  table.cmp thead th { border-bottom: 2px solid var(--grid); }
  table.cmp td:first-child { color: var(--dim); white-space: nowrap; }
  table.cmp .c-spont th { color: var(--as); }
  table.cmp .c-cars th { color: var(--accent); }
  table.cmp .c-srs th { color: var(--srs); }
  table.cmp td.on, table.cmp th.on { background: var(--panel2); }
  .model { font-size: 0.76rem; color: var(--dim); line-height: 1.7; }
  .model .m { color: var(--muted); }
  /* —— 導覽 / Guided tour —— */
  .tour { width: 100%; max-width: 940px; background: var(--panel); border-radius: 12px; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
  :root[data-theme="light"] .tour { box-shadow: 0 1px 3px rgba(20,24,40,0.06); }
  .tour-start { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 0.84rem; color: var(--muted); }
  .tour-start button, .tour-ctl button {
    font-family: inherit; cursor: pointer; border-radius: 999px; border: 1px solid var(--grid);
    background: none; color: var(--ink); font-size: 0.82rem; padding: 6px 12px; line-height: 1.2;
    transition: border-color .15s, background-color .15s, color .15s, transform .15s;
  }
  .tour-start button.go, .tour-ctl button.play { background: var(--as); border-color: var(--as); color: var(--on-ink); font-weight: 600; }
  .tour-start button:hover, .tour-ctl button:hover { border-color: var(--muted); }
  .tour-start button.go:hover, .tour-ctl button.play:hover { transform: translateY(-1px); }
  .tour-ctl button:disabled { opacity: .35; cursor: default; transform: none; }
  /* 導覽期間：講解面板搬進右側欄並固定在視窗內，圖在左邊跑，隨時看得到第幾步 */
  .tour-body { display: none; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  body.touring .tour-body { display: grid; }
  body.touring #tour { display: none; }
  body.touring aside.controls > :not(.tour-body) { display: none; }
  body.touring aside.controls {
    position: sticky; top: 16px; align-self: flex-start;
    max-height: calc(100vh - 32px); overflow-y: auto; border: 1px solid var(--as);
  }
  .tour-head { display: flex; align-items: baseline; gap: 10px; font-size: 0.8rem; color: var(--dim); }
  .tour-head b { color: var(--as); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .tour-head span { color: var(--ink); font-weight: 600; font-size: 0.95rem; }
  .tour-say { margin: 6px 0 0; font-size: 0.92rem; line-height: 1.8; color: var(--ink); min-height: 9em; }
  .tour-say .m { color: var(--as); }
  .tour-say.fade { animation: tour-in .45s ease both; }
  @keyframes tour-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .tour-ctl { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  .tour-ctl .sp { flex: 1; }
  .tour-bar { height: 3px; background: var(--grid); border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .tour-bar i { display: block; height: 100%; width: 0; background: var(--as); transition: width .35s ease; }
  .tour-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 0.8rem; }
  .tour-steps button {
    width: 100%; text-align: left; font-family: inherit; font-size: inherit; cursor: pointer; color: var(--muted);
    background: none; border: 0; border-left: 2px solid transparent; padding: 4px 8px; border-radius: 0 6px 6px 0; line-height: 1.4;
  }
  .tour-steps button:hover { color: var(--ink); background: var(--panel2); }
  .tour-steps button.on { color: var(--ink); font-weight: 600; border-left-color: var(--as); background: var(--panel2); }
  .tour-steps button.done { color: var(--dim); }
  .tour-steps small { display: inline-block; width: 1.4em; color: var(--dim); font-variant-numeric: tabular-nums; }
  .stack canvas { transition: opacity .5s ease, box-shadow .5s ease; }
  body.touring .stack canvas { opacity: .32; }
  body.touring .stack canvas.focus { opacity: 1; box-shadow: 0 0 0 2px var(--as); }
  /* 手機：右側欄在圖下方，改成貼在畫面底部的講解面板 */
  @media (max-width: 640px) {
    body.touring { padding-bottom: 50vh; }
    body.touring aside.controls { position: static; padding: 0; border: 0; background: none; box-shadow: none; max-height: none; overflow: visible; }
    body.touring .tour-body {
      position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 20; gap: 8px;
      background: var(--panel); border: 1px solid var(--as); border-radius: 12px; padding: 12px 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.28); max-height: 46vh; overflow-y: auto;
    }
    .tour-say { min-height: 0; font-size: 0.88rem; line-height: 1.7; }
    .tour-steps { flex-direction: row; flex-wrap: wrap; }
    .tour-steps button { width: auto; border-left: 0; border-bottom: 2px solid transparent; border-radius: 6px 6px 0 0; padding: 3px 7px; }
    .tour-steps button.on { border-bottom-color: var(--as); }
    .tour-steps .lbl { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tour-say.fade { animation: none; }
    .stack canvas { transition: none; }
  }
  @media (max-width: 640px) {
    body { padding: 12px 10px 32px; }
    .controls { flex: 1 1 100%; max-width: 100%; }
    .stack { flex-basis: 100%; }
  }
</style>
</head>
<body>
<h1 data-i18n="title"></h1>
<p class="sub" data-i18n="sub"></p>
<section class="tour" id="tour" aria-label="guided tour">
  <div class="tour-start">
    <button class="go" id="tourGo" data-i18n="tour.go"></button>
    <span data-i18n="tour.pitch"></span>
  </div>
  <div class="tour-body">
    <div>
      <div class="tour-head"><b id="tourN"></b><span id="tourTitle"></span></div>
      <p class="tour-say" id="tourSay" aria-live="polite"></p>
      <div class="tour-ctl">
        <button id="tourPrev" data-i18n-title="tour.prev" aria-label="prev">‹</button>
        <button class="play" id="tourPlay"></button>
        <button id="tourNext" data-i18n-title="tour.next" aria-label="next">›</button>
        <button id="tourAgain" data-i18n="tour.again"></button>
        <span class="sp"></span>
        <button id="tourClose" data-i18n="tour.close"></button>
      </div>
      <div class="tour-bar"><i id="tourBar"></i></div>
    </div>
    <ol class="tour-steps" id="tourSteps"></ol>
  </div>
</section>
<div class="wrap">
  <div class="stack">
    <canvas id="beat"></canvas>
    <canvas id="spec"></canvas>
    <canvas id="scan"></canvas>
  </div>
  <aside class="controls">
    <div class="head">
      <span class="title" data-i18n="ctl.mode"></span>
      <span class="btns">
        <button class="chip" id="lang" data-i18n-title="btn.lang.title"></button>
        <button class="chip" id="theme" data-i18n-title="btn.theme.title"></button>
        <button class="chip" id="reset" data-i18n="btn.reset" data-i18n-title="btn.reset.title"></button>
      </span>
    </div>
    <div class="presets" id="modes"></div>
    <div class="ctl">
      <label><span data-i18n="lbl.pump"></span><output id="pOut"></output></label>
      <input type="range" id="pump" min="700" max="1100" step="5" value="800">
    </div>
    <div class="ctl" id="deltaCtl">
      <label><span data-i18n="lbl.delta"></span><output id="dOut"></output></label>
      <div class="row2">
        <input type="range" id="delta" min="0" max="3600" step="5" value="2000">
        <button class="chip" id="lock" data-i18n="btn.lock" data-i18n-title="btn.lock.title"></button>
      </div>
    </div>
    <div class="ctl">
      <label><span data-i18n="lbl.omega"></span><output id="omOut"></output></label>
      <input type="range" id="omega" min="400" max="3600" step="5" value="2845">
      <div class="presets" id="presets" style="margin-top:8px"></div>
    </div>
    <div class="ctl">
      <label><span data-i18n="lbl.gamma"></span><output id="gOut"></output></label>
      <input type="range" id="gamma" min="2" max="200" step="1" value="12">
    </div>
    <div class="ctl" id="nrCtl">
      <label><span data-i18n="lbl.nr"></span><output id="nrOut"></output></label>
      <input type="range" id="nr" min="0" max="1" step="0.02" value="0.3">
    </div>
    <div class="toggle">
      <input type="checkbox" id="anim" checked>
      <label for="anim" data-i18n="lbl.anim"></label>
    </div>
    <div class="stats" id="stats"></div>
  </aside>
</div>

<section class="notes">
  <div class="card">
    <h3 data-i18n="cmp.title"></h3>
    <div class="tblwrap">
      <table class="cmp" id="cmp">
        <thead><tr>
          <th></th>
          <th class="c-spont" data-m="spont" data-i18n="mode.spont"></th>
          <th class="c-cars" data-m="cars">CARS</th>
          <th class="c-srs" data-m="srs">SRS</th>
        </tr></thead>
        <tbody id="cmpBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <details open>
      <summary data-i18n="hints.title"></summary>
      <div id="hints"></div>
    </details>
  </div>

  <p class="model" data-i18n="model"></p>
</section>

<script>
const $ = id => document.getElementById(id);

// ═══════════════════════════ 文字字典 / Strings ═══════════════════════════
// 值可以是字串，或吃參數的函式。t(key, ...args) 取用。
const M = s => `<span class="m">${s}</span>`;
const I18N = {
zh: {
  'title': 'CARS 拍頻遊樂場 🦉',
  'sub': `兩束雷射為什麼一定要「不同顏色」？因為 pump 與 Stokes 疊加後的<b>拍頻</b>
    ${M('Δ = ω<sub>p</sub> − ω<sub>s</sub>')} 才是真正推分子的那隻手。
    當 Δ 對上化學鍵振動頻率 ${M('Ω')}，整片分子像被準時推的鞦韆一起盪起來，
    訊號跑到 ${M('ω<sub>as</sub> = 2ω<sub>p</sub> − ω<sub>s</sub>')}——比 pump 更藍，天生避開螢光。
    用「技術模式」切換自發拉曼 / CARS / SRS，三種拉曼技術擺在同一組座標下比。`,
  'ctl.mode': '技術模式',
  'btn.lang.title': 'Switch to English',
  'btn.theme.title': '切換深色／淺色',
  'theme.light': '☀ 淺色', 'theme.dark': '🌙 深色',
  'btn.reset': '重設', 'btn.reset.title': '回到預設值',
  'lbl.pump': `pump 波長 ${M('λ<sub>p</sub>')}`,
  'lbl.delta': `拍頻 ${M('Δ')}（拉曼位移）`,
  'btn.lock': '對準 Ω', 'btn.lock.title': '把 Δ 設成 Ω',
  'lbl.omega': `分子振動 ${M('Ω')}`,
  'lbl.gamma': `線寬 ${M('Γ')}（HWHM）`,
  'lbl.nr': `非共振背景 ${M('χ<sub>NR</sub>')}／${M('A')}`,
  'lbl.anim': '動畫：兩道波以光速前進，看拍包絡滾動',
  'mode.spont': '自發拉曼',
  'preset.lipid': '脂質 CH₂', 'preset.lipid.note': '對稱伸縮',
  'preset.protein': '蛋白質 CH₃', 'preset.protein.note': '伸縮，帶較寬',
  'preset.water': '水 O–H', 'preset.water.note': '氫鍵網路，極寬',
  'preset.cc': 'C=C / Amide I', 'preset.cc.note': '不飽和鍵、蛋白骨架',
  'preset.phe': 'Phe 苯環', 'preset.phe.note': '環呼吸，極窄',
  'preset.apatite': '磷灰石 PO₄', 'preset.apatite.note': 'ν₁ 對稱伸縮；牙齒／骨',
  // 圖 1
  'b.oneLaser': '（只需一束雷射）',
  'b.axis': x => `橫軸 = 24 λp ≈ ${x} µm　`,
  'b.ratio': (x, wide) => `Δ/ωp = ${x}%${wide ? '（比例真實）' : ''}`,
  'b.single': '單束光：振幅平平，沒有拍包絡 → 沒有那隻推鞦韆的手',
  'b.sum': n => `兩束相加：拍包絡（${n === null ? '不到半個拍' : n + ' 個拍'}）`,
  'b.same': '同色 → 沒有拍 → 推不動',
  'b.random': '分子各抖各的（相位隨機）→ 訊號 ∝ N，往 4π 亂射',
  'b.coh': (a, p) => `分子同調振動（波向量 k_p − k_s）　|A| = ${a}%　落後 φ = ${p}°`,
  'b.res': '共振：落後 90°、振幅最大',
  'b.dash': '灰色虛線＝推力（拍強度）峰位',
  // 圖 2
  's.fluo': '螢光背景（紅側）',
  's.x': '波長 (nm)', 's.y': '強度 (a.u.)',
  's.resStokes': 'Δ=Ω 時的 Stokes',
  's.carsHead': d => `偵測窗：anti-Stokes 在 pump 藍側 ${d} nm 處，帶通濾鏡即可分離`,
  's.srsHead': '訊號＝雷射本身的微小增減（圖上已放大；真實 ΔI/I ~ 10⁻⁴，靠 MHz 調變＋鎖相放大）',
  's.spontPeak': l => `Stokes 拉曼 ${l} nm（弱 ~10⁵ 倍，線寬照真實 Γ 畫）`,
  's.boltz': v => `×e^(−hcΩ/kT) = ${v}（300 K）`,
  's.spontHead': '峰位由 Ω 決定（不用第二束雷射）；紅側 → 跟螢光疊在一起',
  // 圖 3
  'n.xShift': '拉曼位移 (cm⁻¹)', 'n.xBeat': '拍頻 Δ (cm⁻¹)',
  'n.yCars': 'I_CARS（歸一）', 'n.ySrs': 'ΔI_SRS（歸一）', 'n.ySpont': 'I_Raman（歸一）',
  'n.baseline': v => `遠離共振的基線 χ_NR² = ${v}`,
  'n.peak': x => `峰 Ω−${x}`, 'n.dip': x => `谷 Ω+${x}`,
  'n.legCars1': '含 χ_NR 干涉', 'n.legCars2': '純共振（χ_NR = 0，虛線）',
  'n.legSrs1': 'SRS ∝ Im χ：純 Lorentzian，χ_NR 進不來', 'n.legSrs2': 'CARS（虛線對照）：被 χ_NR 拉歪',
  'n.legSpont': '自發拉曼：同樣的 Lorentzian，只是弱 ~10⁵ 倍',
  // 統計
  'st.wl': '波長 ↔ 波數', 'st.pump': 'pump ω<sub>p</sub>',

    `<b>No beat, no signal.</b> Drag Δ to 0: both beams have the same colour, the difference frequency vanishes and the envelope in the second row goes flat.

const FONT = '12px "Noto Serif TC", "Source Han Serif TC", serif';
const FONT_S = '11px "Noto Serif TC", "Source Han Serif TC", serif';
const DPR = Math.min(window.devicePixelRatio || 1, 2.5);

// —— HiDPI canvas ——
// 邏輯寬度跟著容器走（最多 600），文字大小不隨縮放變小
const setup = (id, H) => ({ cv: $(id), ctx: $(id).getContext('2d'), W: 600, H });
const B = setup('beat', 236), S = setup('spec', 236), N = setup('scan', 250);
function resize() {
  const avail = B.cv.parentElement.clientWidth || 600;
  const W = Math.max(300, Math.min(600, Math.floor(avail)));
  for (const P of [B, S, N]) {
    P.W = W;
    P.cv.width = Math.round(W * DPR); P.cv.height = Math.round(P.H * DPR);
    P.cv.style.width = W + 'px';
    P.ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
}
resize();
let rsTimer = 0;
window.addEventListener('resize', () => { clearTimeout(rsTimer); rsTimer = setTimeout(resize, 80); });

const txt = (ctx, s, x, y, color, align = 'left', font = FONT) => {
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(s, x, y);
};
// 置中文字，但不讓它超出 [x0, x1]
const ctxt = (ctx, s, x, y, color, x0, x1, font = FONT_S) => {
  ctx.font = font; const w = ctx.measureText(s).width;
  const xc = Math.min(Math.max(x, x0 + w / 2 + 2), x1 - w / 2 - 2);
  txt(ctx, s, xc, y, color, 'center', font);
};
// 帶底色的文字（蓋住穿過的線）
const pill = (ctx, s, x, y, color, align = 'left', font = FONT_S) => {
  ctx.font = font; const w = ctx.measureText(s).width;
  const x0 = align === 'left' ? x : align === 'right' ? x - w : x - w / 2;
  ctx.fillStyle = rgba(C.panelRgb, 0.88); ctx.fillRect(x0 - 3, y - 10, w + 6, 13);
  txt(ctx, s, x, y, color, align, font);
};
const hline = (ctx, x0, x1, y, color, dash) => {
  ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.setLineDash(dash || []);
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); ctx.setLineDash([]);
};
const vline = (ctx, x, y0, y1, color, dash, lw = 1) => {
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.setLineDash(dash || []);
  ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke(); ctx.setLineDash([]);
};
const path = (ctx, n, fn, color, lw, dash) => {
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.setLineDash(dash || []);
  ctx.beginPath();
  for (let i = 0; i <= n; i++) { const [x, y] = fn(i); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke(); ctx.setLineDash([]);
};
const fmt = (v, d = 1) => v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const sci = v => { if (v === 0) return '0'; const e = Math.floor(Math.log10(v)); const m = v / 10 ** e;
  return (e >= -2 && e <= 3) ? fmt(v, e >= 0 ? Math.max(0, 2 - e) : 3) : `${m.toFixed(1)}×10${sup(e)}`; };
const sup = n => String(n).replace(/-/g, '⁻').replace(/\d/g, d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]);

// —— 狀態 ——
const MODES = [
  { key: 'spont', name: () => t('mode.spont') },
  { key: 'cars',  name: () => 'CARS' },
  { key: 'srs',   name: () => 'SRS' },
];
const PRESETS = [
  { key: 'lipid',   om: 2845, g: 12 },
  { key: 'protein', om: 2930, g: 20 },
  { key: 'water',   om: 3400, g: 150 },
  { key: 'cc',      om: 1655, g: 10 },
  { key: 'phe',     om: 1003, g: 5 },
  { key: 'apatite', om: 960,  g: 8 },
];
const DEF = { m: 'cars', lp: 800, d: 2000, om: 2845, g: 12, nr: 0.3 };
let mode = DEF.m, LP = DEF.lp;
const DMAX = 3600;
const KT = 208.5;                     // k_B·T / hc at 300 K, cm⁻¹

// —— 物理 ——
const WN = l => 1e7 / l;              // nm → cm⁻¹
const NM = w => 1e7 / w;              // cm⁻¹ → nm
const lamS  = D => NM(WN(LP) - D);
const lamAS = D => NM(WN(LP) + D);    // ω_as = 2ω_p − ω_s = ω_p + Δ
const ampl  = (D, om, g) => g / Math.hypot(om - D, g);            // |A(Δ)|
const phase = (D, om, g) => Math.atan2(g, om - D);                // 落後相位 φ ∈ (0, π)
const imChi = (D, om, g) => { const d = om - D; return g * g / (d * d + g * g); };
function iCars(D, om, g, nr) {        // |χ_NR + Γ/(Ω−Δ−iΓ)|²
  const d = om - D, den = d * d + g * g;
  const re = nr + g * d / den, im = g * g / den;
  return re * re + im * im;
}
// χ_NR 干涉造成的峰位／凹陷（以 x = (Ω−Δ)/Γ 表示）：nr·x² + x − nr = 0
function carsExtrema(g, nr) {
  if (nr < 1e-4) return { xp: nr, xm: -Infinity };
  const s = Math.sqrt(1 + 4 * nr * nr);
  return { xp: (-1 + s) / (2 * nr), xm: (-1 - s) / (2 * nr) };
}
function scanCurve(om, g, nr, n = 720) {
  const res = [], pure = [], lor = [];
  let max = 0;
  for (let i = 0; i <= n; i++) {
    const D = DMAX * i / n;
    const v = iCars(D, om, g, nr);
    res.push(v); pure.push(iCars(D, om, g, 0)); lor.push(imChi(D, om, g));
    if (v > max) max = v;
  }
  return { res, pure, lor, max, n };
}

// —— 1. 拍頻（橫軸比例真實）——
function drawBeat(D, om, g, tm) {
  const { ctx, W, H } = B;
  ctx.clearRect(0, 0, W, H);
  const mL = 14, pw = W - 28;
  const np = 24;                               // 24 個 pump 週期
  const wp = WN(LP);
  const nb = np * D / wp;                      // 拍數 = 24·Δ/ω_p（真實比例）
  const ns = np - nb;                          // Stokes 週期數
  const v = 0.045;                             // 兩束同相速（真空）→ 整體剛性平移
  const drive = u => 2 * Math.PI * (nb * u - nb * v * tm);  // 拍（強度）相位

  // 第一列：pump + Stokes
  const y1 = 46, a1 = 20;
  hline(ctx, mL, mL + pw, y1, C.grid);
  path(ctx, pw, i => { const u = i / pw; return [mL + i, y1 - a1 * Math.cos(2 * Math.PI * np * (u - v * tm))]; }, C.accent, 1.5);
  // 導覽時三列可以逐層點亮（alpha 0 → 1）
  const VS = TOUR.on ? TOUR.p.stokes : 1, VSUM = TOUR.on ? TOUR.p.sum : 1, VMOL = TOUR.on ? TOUR.p.mol : 1;
  ctx.globalAlpha = VS;
  if (mode !== 'spont' && VS > 0)
    path(ctx, pw, i => { const u = i / pw; return [mL + i, y1 - a1 * Math.cos(2 * Math.PI * ns * (u - v * tm))]; }, C.ref, 1.5, [4, 4]);
  ctx.globalAlpha = 1;
  txt(ctx, `pump ${LP} nm`, mL + 2, 15, C.accent);
  ctx.globalAlpha = VS;
  if (mode === 'spont') txt(ctx, t('b.oneLaser'), mL + 100, 15, C.muted);
  else txt(ctx, `Stokes ${lamS(D).toFixed(0)} nm`, mL + 100, 15, C.ref);
  ctx.globalAlpha = 1;
  const wide = W >= 520;
  const rlab = (wide ? t('b.axis', fmt(24 * LP / 1000, 1)) : '') + (mode === 'spont' ? '' : t('b.ratio', fmt(100 * D / wp, 1), wide));
  txt(ctx, rlab, mL + pw, 15, C.dim, 'right', FONT_S);

  // 第二列：相加 + 包絡
  const y2 = 122, a2 = 15;
  hline(ctx, mL, mL + pw, y2, C.grid);
  ctx.globalAlpha = VSUM;
  if (mode === 'spont') {
    path(ctx, pw, i => { const u = i / pw; return [mL + i, y2 - a2 * 1.3 * Math.cos(2 * Math.PI * np * (u - v * tm))]; }, C.ink, 1.4);
    txt(ctx, t('b.single'), mL + 2, y2 - 32, C.muted);
  } else {
    const env = u => 2 * Math.abs(Math.cos(Math.PI * nb * (u - v * tm)));
    for (const sgn of [1, -1])
      path(ctx, pw, i => { const u = i / pw; return [mL + i, y2 - sgn * a2 * env(u)]; }, C.muted, 1, [3, 3]);
    path(ctx, pw, i => {
      const u = i / pw;
      const s = Math.cos(2 * Math.PI * np * (u - v * tm)) + Math.cos(2 * Math.PI * ns * (u - v * tm));
      return [mL + i, y2 - a2 * s];
    }, C.ink, 1.3);
    txt(ctx, t('b.sum', nb < 0.5 ? null : fmt(nb, 1)), mL + 2, y2 - 32, C.ink);
    if (D < 30) txt(ctx, t('b.same'), mL + pw * 0.62, y2 - 32, C.ref, 'center');
  }
  ctx.globalAlpha = 1;

  // 第三列：分子振動
  const y3 = 198;
  hline(ctx, mL, mL + pw, y3, C.grid);
  ctx.globalAlpha = VMOL;
  if (mode === 'spont') {
    path(ctx, pw, i => {
      const u = i / pw;
      return [mL + i, y3 - 3.5 * Math.sin(2 * Math.PI * 6 * u + 5 * Math.sin(u * 53 + 0.7 * tm) + tm * 4)];
    }, C.as, 1.2);
    txt(ctx, t('b.random'), mL + 2, y3 - 26, C.as);
  } else {
    const A = ampl(D, om, g), ph = phase(D, om, g);
    // 受驅振子：時間上落後 φ → 空間上落在驅動峰後方（+φ）
    path(ctx, pw, i => { const u = i / pw; return [mL + i, y3 - 24 * A * Math.cos(drive(u) + ph)]; }, C.as, 2);
    // 標出驅動（拍強度）的峰位，讓落後看得見
    if (A > 0.15 && nb > 0.4) {
      const k0 = Math.ceil(-nb * v * tm), n0 = Math.floor(nb - nb * v * tm);
      for (let k = k0; k <= n0; k++) {
        const u = (k + nb * v * tm) / nb; if (u < 0 || u > 1) continue;

      ctx.font = FONT; const wl = ctx.measureText(t('b.coh', fmt(A * 100, A < 0.1 ? 1 : 0), fmt(ph * 180 / Math.PI, 0))).width;
      ctx.font = FONT_S; const wr = ctx.measureText(rightLab[0]).width;
      const fits = wl + wr + 24 < pw;
      txt(ctx, rightLab[0], mL + pw, fits ? y3 - 26 : y3 + 34, rightLab[1], 'right', FONT_S);
    }
  }
  ctx.globalAlpha = 1;
}

// —— 2. 光譜 ——
let asDisp = 0;
function drawSpec(D, om, g) {
  const { ctx, W, H } = S;
  ctx.clearRect(0, 0, W, H);
  const mL = 46, mR = 16, mT = 30, mB = 32;
  const pw = W - mL - mR, ph = H - mT - mB, base = mT + ph;
  const wp = WN(LP);
  const LMIN = Math.floor(NM(wp + DMAX) / 50) * 50 - 50;
  const LMAX = Math.ceil(NM(wp - DMAX) / 50) * 50 + 50;
  const X = l => mL + pw * (l - LMIN) / (LMAX - LMIN);
  const F = ph * 0.84;
  const Y = f => base - F * f;

  // 螢光背景（pump 紅側）
  const gx = ctx.createLinearGradient(X(LP), 0, X(LMAX), 0);
  gx.addColorStop(0, rgba(C.refRgb, C.fluoA)); gx.addColorStop(1, rgba(C.refRgb, C.fluoB));
  ctx.fillStyle = gx; ctx.fillRect(X(LP), mT, X(LMAX) - X(LP), ph);
  txt(ctx, t('s.fluo'), mL + pw - 6, mT + 14, rgba(C.refRgb, 0.8), 'right', FONT_S);

  // 軸
  hline(ctx, mL, mL + pw, base, C.grid);
  const tick = (LMAX - LMIN) > 900 ? 200 : 100;
  for (let l = Math.ceil(LMIN / tick) * tick; l <= LMAX; l += tick) {
    vline(ctx, X(l), base, base + 4, C.muted);
    txt(ctx, l, X(l), base + 17, C.muted, 'center', FONT_S);
  }
  txt(ctx, t('s.x'), mL + pw / 2, H - 4, C.muted, 'center', FONT_S);
  ctx.save(); ctx.translate(14, mT + ph / 2); ctx.rotate(-Math.PI / 2);
  txt(ctx, t('s.y'), 0, 0, C.muted, 'center', FONT_S); ctx.restore();

  const line = (l, frac, color, label, lw = 3, dy = -6) => {
    if (l < LMIN || l > LMAX) return;
    vline(ctx, X(l), base, Y(frac), color, [], lw);
    if (label) ctxt(ctx, label, X(l), Y(frac) + dy, color, mL, mL + pw);
  };
  const ls = lamS(D), las = lamAS(D);

  if (mode !== 'spont') {
    // 共振時 Stokes 應該在的位置（Δ = Ω）
    const lres = lamS(om);
    if (Math.abs(lres - ls) > 3 && lres < LMAX) {
      vline(ctx, X(lres), Y(0.60), base, rgba(C.refRgb, 0.5), [2, 4]);
      const right = X(lres) < mL + pw - 110;
      pill(ctx, right ? `${lres.toFixed(0)} ${t('s.resStokes')}` : `${t('s.resStokes')} ${lres.toFixed(0)}`,
          X(lres) + (right ? 5 : -5), Y(0.60) + 4, rgba(C.refRgb, 0.85), right ? 'left' : 'right');
    }
  }

  if (mode === 'cars') {
    line(ls, 0.72, C.ref, `Stokes ${ls.toFixed(0)}`);
    line(LP, 0.72, C.accent, `pump ${LP}`);
    line(las, asDisp, C.as, `anti-Stokes ${las.toFixed(0)}`);
    txt(ctx, t('s.carsHead', fmt(LP - las, 0)), mL + 2, 16, C.muted, 'left', FONT_S);
  } else if (mode === 'srs') {
    const dI = 0.20 * asDisp;                 // 圖上誇大的 ΔI（真實 ~1e-4）
    line(LP, 0.72 - dI, C.accent, `pump ${LP}`);
    line(ls, 0.72, C.ref, `Stokes ${ls.toFixed(0)}`);
    vline(ctx, X(ls), Y(0.72), Y(0.72 + dI), C.srs, [], 3);                 // SRG
    vline(ctx, X(LP), Y(0.72 - dI), Y(0.72), C.accent, [3, 3], 1);          // SRL
    if (dI > 0.02) {
      txt(ctx, 'SRG +ΔI', X(ls), Y(0.72 + dI) - 18, C.srs, 'center', FONT_S);
      txt(ctx, 'SRL −ΔI', X(LP), Y(0.72) - 18, C.accent, 'center', FONT_S);
    }
    txt(ctx, t('s.srsHead'), mL + 2, 16, C.muted, 'left', FONT_S);
  } else {
    line(LP, 0.72, C.accent, `pump ${LP}`);
    // 自發拉曼：Lorentzian，線寬用真實的 Γ（換到波長軸上非常窄）
    const lr = lamS(om), lra = lamAS(om);
    const peak = 0.13;
    path(ctx, pw * 2, i => {
      const l = LMIN + (LMAX - LMIN) * i / (pw * 2);
      const v = peak * imChi(wp - WN(l), om, g);
      return [X(l), Y(v)];
    }, C.as, 1.6);
    ctxt(ctx, t('s.spontPeak', lr.toFixed(0)), X(lr), Y(peak) - 8, C.as, X(LP) + 10, mL + pw);
    const boltz = Math.exp(-om / KT);
    const va = peak * boltz;
    path(ctx, pw * 2, i => {
      const l = LMIN + (LMAX - LMIN) * i / (pw * 2);
      const v = va * imChi(WN(l) - wp, om, g);
      return [X(l), Y(v)];
    }, C.as, 1.2);
    vline(ctx, X(lra), Y(0.05), Y(0.02), rgba(C.asRgb, 0.5), [2, 2]);
    ctxt(ctx, `anti-Stokes ${lra.toFixed(0)} nm`, X(lra), Y(0.05) - 20, rgba(C.asRgb, 0.9), mL, X(LP) - 4);
    ctxt(ctx, t('s.boltz', sci(boltz)), X(lra), Y(0.05) - 6, rgba(C.asRgb, 0.75), mL, X(LP) - 4);
    txt(ctx, t('s.spontHead'), mL + 2, 16, C.muted, 'left', FONT_S);
  }
}

// —— 3. 失諧掃描 ——
function drawScan(D, om, g, nr, cur) {
  const { ctx, W, H } = N;
  ctx.clearRect(0, 0, W, H);
  const mL = 58, mR = 16, mT = 24, mB = 34;
  const pw = W - mL - mR, ph = H - mT - mB, base = mT + ph;
  const X = d => mL + pw * d / DMAX;
  const Y = v => base - ph * 0.9 * v;

  for (let d = 0; d <= DMAX; d += 500) {
    vline(ctx, X(d), mT, base, C.grid);
    txt(ctx, d, X(d), base + 16, C.muted, 'center', FONT_S);
  }
  for (let k = 0; k <= 4; k++) {
    hline(ctx, mL, mL + pw, Y(k / 4), C.grid);
    txt(ctx, (k / 4).toFixed(2), mL - 7, Y(k / 4) + 4, C.muted, 'right', FONT_S);
  }
  txt(ctx, mode === 'spont' ? t('n.xShift') : t('n.xBeat'), mL + pw / 2, H - 5, C.muted, 'center', FONT_S);
  ctx.save(); ctx.translate(14, mT + ph / 2); ctx.rotate(-Math.PI / 2);
  txt(ctx, mode === 'cars' ? t('n.yCars') : mode === 'srs' ? t('n.ySrs') : t('n.ySpont'), 0, 0, C.muted, 'center', FONT_S);
  ctx.restore();

  const { res, pure, lor, max, n } = cur;
  // 導覽時曲線跟著 Δ 游標「畫出來」
  const REV = TOUR.on ? TOUR.p.reveal : 1;
  ctx.save();
  if (REV < 1) { ctx.beginPath(); ctx.rect(0, 0, mL + pw * REV, H); ctx.clip(); }
  const trace = (arr, mx, color, lw, dash) =>
    path(ctx, n, i => [X(DMAX * i / n), Y(arr[i] / mx)], color, lw, dash);

  if (mode === 'cars') {
    trace(pure, max, C.ref, 1.3, [5, 4]);
    trace(res, max, C.accent, 2.2);
    // 基線 χ_NR² 與峰／谷標記
    if (nr > 0.02) {
      const bl = nr * nr / max;
      hline(ctx, mL, mL + pw, Y(bl), rgba(C.accentRgb, 0.4), [2, 4]);
      txt(ctx, t('n.baseline', fmt(bl, 2)), mL + 6, Y(bl) - 5, rgba(C.accentRgb, 0.7), 'left', FONT_S);
      const { xp, xm } = carsExtrema(g, nr);
      const Dp = om - g * xp, Dm = om - g * xm;
      const mark = (Dx, label, up) => {
        if (Dx < 0 || Dx > DMAX) return;
        const y = Y(iCars(Dx, om, g, nr) / max);
        ctx.fillStyle = C.ref; ctx.beginPath();
        if (up) { ctx.moveTo(X(Dx), y + 7); ctx.lineTo(X(Dx) - 4, y + 13); ctx.lineTo(X(Dx) + 4, y + 13); }
        else    { ctx.moveTo(X(Dx), y - 7); ctx.lineTo(X(Dx) - 4, y - 13); ctx.lineTo(X(Dx) + 4, y - 13); }
        ctx.fill();
        txt(ctx, label, X(Dx) + (up ? -6 : 8), up ? y + 24 : y - 16, C.ref, up ? 'right' : 'left', FONT_S);
      };
      mark(Dp, t('n.peak', fmt(g * xp, 1)), true);
      mark(Dm, t('n.dip', fmt(-g * xm, 1)), false);
    }
  } else {
    if (mode === 'srs') trace(res, max, C.grid, 1.4, [5, 4]);
    trace(lor, 1, mode === 'srs' ? C.srs : C.as, 2.2);
    // FWHM 標示
    const yh = Y(0.5);
    ctx.strokeStyle = rgba(C.inkRgb, 0.4); ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
    ctx.beginPath(); ctx.moveTo(X(Math.max(0, om - g)), yh); ctx.lineTo(X(Math.min(DMAX, om + g)), yh); ctx.stroke(); ctx.setLineDash([]);
    const wide = X(om + g) - X(om - g) > 20;
    if (om < DMAX * 0.7) txt(ctx, `${wide ? '' : '← '}FWHM = 2Γ = ${2 * g} cm⁻¹`, X(om + g) + 8, yh + 4, C.muted, 'left', FONT_S);
    else txt(ctx, `FWHM = 2Γ = ${2 * g} cm⁻¹${wide ? '' : ' →'}`, X(om - g) - 8, yh + 4, C.muted, 'right', FONT_S);
  }

  ctx.restore();

  // Ω 標記
  vline(ctx, X(om), mT, base, C.as, [2, 3]);
  txt(ctx, `Ω = ${om}`, X(om), mT - 8, C.as, 'center', FONT_S);

  // 目前 Δ
  if (mode !== 'spont') {
    const vv = mode === 'cars' ? iCars(D, om, g, nr) / max : imChi(D, om, g);
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(X(D), Y(vv), 4.5, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = C.panel; ctx.lineWidth = 1.5; ctx.stroke();
  }
  if (mode === 'cars') {
    txt(ctx, t('n.legCars1'), mL + 6, mT + 12, C.accent, 'left', FONT_S);
    txt(ctx, t('n.legCars2'), mL + 6, mT + 26, C.ref, 'left', FONT_S);
  } else if (mode === 'srs') {
    txt(ctx, t('n.legSrs1'), mL + 6, mT + 12, C.srs, 'left', FONT_S);
    txt(ctx, t('n.legSrs2'), mL + 6, mT + 26, C.muted, 'left', FONT_S);
  } else {
    txt(ctx, t('n.legSpont'), mL + 6, mT + 12, C.as, 'left', FONT_S);
  }
}

// —— 統計 ——
const R = (k, v, hi) => `<div class="r${hi ? ' hi' : ''}"><span>${k}</span><b>${v}</b></div>`;
const H4 = s => `<h4>${s}</h4>`;
const SEP = () => LANG === 'en' ? ', ' : '，';
function updateStats(D, om, g, nr, cur) {
  const wp = WN(LP), ls = lamS(D), las = lamAS(D);
  const tauTL = 7.355 / g;                      // 頻寬 FWHM = 2Γ 的變換極限高斯脈衝 (ps)
  const common = H4(t('st.wl')) + R(t('st.pump'), `${fmt(wp, 0)} cm⁻¹`);
  const lwBlock = R(t('st.fwhm'), `${2 * g} cm⁻¹ = ${fmt(2 * g * 29.98, 0)} GHz`) + R(t('st.tl'), `≈ ${fmt(tauTL, 2)} ps`);
  const ampRow = R(t('st.amp'), `${fmt(ampl(D, om, g) * 100, 1)} %${SEP()}${fmt(phase(D, om, g) * 180 / Math.PI, 0)}°`);
  let html = '';
  if (mode === 'cars') {
    const rel = iCars(D, om, g, nr) / cur.max;
    const { xp, xm } = carsExtrema(g, nr);
    const peak = nr * nr + (2 * nr * xp + 1) / (xp * xp + 1);
    const dip = nr > 1e-4 ? nr * nr + (2 * nr * xm + 1) / (xm * xm + 1) : 0;
    html = common +
      R(t('st.stokes'), `${fmt(ls, 1)} nm (${fmt(wp - D, 0)} cm⁻¹)`) +
      R(t('st.as'), `${fmt(las, 1)} nm (${fmt(wp + D, 0)} cm⁻¹)`) +
      R(t('st.gap'), `+${fmt(ls - LP, 0)} / −${fmt(LP - las, 0)} nm`) +
      H4(t('st.res')) +
      R(t('st.detune'), `${fmt(om - D, 0)} cm⁻¹`) + ampRow +
      R(t('st.relCars'), `${fmt(rel * 100, 1)} %`, true) +
      H4(t('st.nrHead')) +
      R(t('st.shift'), nr > 1e-4 ? `−${fmt(g * xp, 1)} cm⁻¹` : '0') +
      R(t('st.dip'), nr > 1e-4 ? `Ω + ${fmt(-g * xm, 1)} cm⁻¹` : t('st.none')) +
      R(t('st.contrast'), nr > 1e-4 ? `${fmt(peak / (nr * nr), 1)} ×` : '∞') +
      R(t('st.dipDepth'), nr > 1e-4 ? `${fmt(100 * dip / (nr * nr), 0)} %` : '—') +
      H4(t('st.lw')) + lwBlock +
      `<div class="note">${t('st.noteCars')}</div>`;
    $('stats').innerHTML = html;
    return rel;
  }
  if (mode === 'srs') {
    const rel = imChi(D, om, g);
    html = common +
      R(t('st.stokes'), `${fmt(ls, 1)} nm (${fmt(wp - D, 0)} cm⁻¹)`) +
      R(t('st.gapS'), `${fmt(ls - LP, 0)} nm`) +
      H4(t('st.res')) +
      R(t('st.detune'), `${fmt(om - D, 0)} cm⁻¹`) + ampRow +
      R(t('st.srsRel'), `${fmt(rel * 100, 1)} %`, true) +
      R(t('st.srsReal'), `~${sci(1e-4 * rel)}`) +
      H4(t('st.lw')) + lwBlock +
      `<div class="note">${t('st.noteSrs')}</div>`;
    $('stats').innerHTML = html;
    return rel;
  }
  const lr = lamS(om), lra = lamAS(om), boltz = Math.exp(-om / KT);
  html = common +
    R(t('st.stokesPeak'), `${fmt(lr, 1)} nm (${fmt(wp - om, 0)} cm⁻¹)`) +
    R(t('st.asPeak'), `${fmt(lra, 1)} nm`) +
    H4(t('st.thermal')) +
    R(t('st.kT'), `${KT} cm⁻¹`) +
    R(t('st.omkT'), `${fmt(om / KT, 1)}`) +
    R(t('st.ratio'), sci(boltz), true) +
    H4(t('st.lwOnly')) +
    R(t('st.fwhm'), `${2 * g} cm⁻¹ = ${fmt(2 * g * 29.98, 0)} GHz`) +
    R(t('st.fwhmNm'), `${fmt(lamS(om + g) - lamS(om - g), 2)} nm`) +
    `<div class="note">${t('st.noteSpont')}</div>`;
  $('stats').innerHTML = html;
  return 0.13;
}

// ═══════════════════════════ 導覽 / Guided tour ═══════════════════════════
// 每一步 = from（瞬間設定）＋ seq（依序補間 [ms, 目標, 緩動]）。goto(k)：先瞬間套用第 0..k-1 步的最終狀態，
// 再只把第 k 步演出來，所以倒退、跳步都不會留下半套狀態。導覽期間三張圖讀 TOUR.p 而不讀滑桿；
// 使用者一碰任何控制項，導覽就把當下的參數交還給他。
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOUR_BASE = { m: 'cars', lp: 800, d: 0, om: 2845, g: 12, nr: 0.3, stokes: 0, sum: 0, mol: 0, reveal: 1, focus: 'beat' };
const TOUR_STEPS = [
  { from: {}, seq: [[2600]] },
  { from: { d: 0 }, seq: [[1200, { stokes: 1 }], [1800]] },
  { from: {}, seq: [[700, { sum: 1 }], [3600, { d: 2000 }], [800]] },
  { from: {}, seq: [[700, { mol: 1 }], [2400, { d: 2790 }], [2800, { d: 2845 }, 'out']] },
  { from: { d: 2845 }, seq: [[1800], [1600, { d: 2890 }], [700], [1600, { d: 2845 }]] },
  { from: { focus: 'spec', d: 2700 }, seq: [[600], [2200, { d: 2845 }, 'out'], [600]] },
  { from: { focus: 'scan', nr: 0, reveal: 0, d: 0 }, seq: [[600], [5200, { d: 3600, reveal: 1 }, 'lin'], [1400, { d: 2845 }]] },
  { from: { focus: 'scan' }, seq: [[400], [2800, { nr: 0.6 }]] },
  { from: { m: 'srs', focus: 'scan' }, seq: [[1200]] },
  { from: { m: 'cars', focus: null, stokes: 1, sum: 1, mol: 1, reveal: 1 }, seq: [[1200, { nr: 0.3, d: 2845 }]] },
];
const EASE = { io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, out: t => 1 - Math.pow(1 - t, 3), lin: t => t };
const TOUR = { on: false, k: -1, playing: false, token: 0, p: { ...TOUR_BASE } };

const tourFinal = k => {                     // 第 k 步結束時的完整狀態
  const st = { ...TOUR_BASE };
  for (let i = 0; i <= k; i++) {
    Object.assign(st, TOUR_STEPS[i].from);
    for (const [, tg] of TOUR_STEPS[i].seq) if (tg) Object.assign(st, tg);
  }
  return st;
};
function tourApplyInstant(st) {
  const prevFocus = TOUR.p.focus;
  Object.assign(TOUR.p, st);
  if (st.m && st.m !== mode) { mode = st.m; markMode(); }
  document.querySelectorAll('.stack canvas').forEach(c => c.classList.toggle('focus', !!TOUR.p.focus && c.id === TOUR.p.focus));
  // 焦點換到畫面外的圖時，把它捲進來
  const fc = TOUR.p.focus && $(TOUR.p.focus);
  if (fc && TOUR.on && TOUR.p.focus !== prevFocus) {
    const r = fc.getBoundingClientRect();
    const phone = matchMedia('(max-width: 640px)').matches;
    const room = phone ? innerHeight * 0.5 : innerHeight;             // 手機底部被講解面板佔掉一半
    if (r.top < 0 || r.bottom > room) fc.scrollIntoView({ behavior: REDUCE ? 'auto' : 'smooth', block: phone ? 'start' : 'center' });
  }
}
function syncSliders() {
  const q = TOUR.p;
  $('pump').value = q.lp; $('delta').value = q.d; $('omega').value = q.om; $('gamma').value = q.g; $('nr').value = q.nr;
}
function tween(ms, tg, ease, token) {
  return new Promise(res => {
    if (REDUCE) { if (tg) Object.assign(TOUR.p, tg); return res(); }
    if (!tg) return setTimeout(res, ms);
    const f = EASE[ease] || EASE.io, a = {};
    for (const k in tg) a[k] = TOUR.p[k];
    const t0 = performance.now();
    const step = now => {
      if (token !== TOUR.token) return res();
      const u = Math.min(1, (now - t0) / ms), e = f(u);
      for (const k in tg) TOUR.p[k] = a[k] + (tg[k] - a[k]) * e;
      u < 1 ? requestAnimationFrame(step) : res();
    };
    requestAnimationFrame(step);
  });
}
async function tourGoto(k, animate = true) {
  const token = ++TOUR.token;
  TOUR.k = k;
  tourApplyInstant(k > 0 ? tourFinal(k - 1) : { ...TOUR_BASE });
  tourApplyInstant(TOUR_STEPS[k].from);
  tourRender(true);
  if (!animate) { tourApplyInstant(tourFinal(k)); return; }
  for (const [ms, tg, ease] of TOUR_STEPS[k].seq) {
    await tween(ms, tg, ease, token);
    if (token !== TOUR.token) return;
  }
  if (!TOUR.playing) return;
  // 留時間讀旁白（中文約 13 字／秒）
  const chars = t('tour.steps')[k][1].replace(/<[^>]+>/g, '').length;
  await new Promise(r => setTimeout(r, Math.min(9000, 1400 + chars * (LANG === 'en' ? 24 : 62))));
  if (token !== TOUR.token || !TOUR.playing) return;
  if (k < TOUR_STEPS.length - 1) tourGoto(k + 1);
  else { TOUR.playing = false; tourRender(false); }
}
function tourRender(newStep) {
  const steps = t('tour.steps'), k = Math.max(0, TOUR.k), n = steps.length;
  $('tourN').textContent = `${k + 1} / ${n}`;
  $('tourTitle').innerHTML = steps[k][0];
  const say = $('tourSay');
  say.innerHTML = steps[k][1];
  if (newStep) { say.classList.remove('fade'); void say.offsetWidth; say.classList.add('fade'); }
  $('tourBar').style.width = `${100 * (k + 1) / n}%`;
  $('tourPlay').textContent = TOUR.playing ? t('tour.pause') : t('tour.play');
  $('tourPrev').disabled = k === 0; $('tourNext').disabled = k === n - 1;
  $('tourSteps').innerHTML = steps.map((s, i) =>
    `<li><button data-i="${i}" class="${i === k ? 'on' : i < k ? 'done' : ''}"><small>${i + 1}</small><span class="lbl">${s[0]}</span></button></li>`).join('');
  $('tourSteps').querySelectorAll('button').forEach(b => b.onclick = () => { TOUR.playing = false; tourGoto(+b.dataset.i); });
}
const tourBody = document.querySelector('.tour-body');
function tourStart() {
  TOUR.on = true; TOUR.playing = true;
  document.querySelector('aside.controls').prepend(tourBody);   // 講解面板搬到右側欄
  $('tour').classList.add('on'); document.body.classList.add('touring');
  tourGoto(0);
  document.querySelector('.wrap').scrollIntoView({ behavior: REDUCE ? 'auto' : 'smooth', block: 'start' });
}
// keep = true：把導覽當下的參數交給滑桿（使用者點了控制項）；false：跳到導覽結尾的狀態
// fromSlider：使用者正在拖的那支滑桿值已經是他要的，別蓋掉
function tourExit(keep = true, fromSlider = false) {
  TOUR.token++; TOUR.playing = false;
  if (!keep) tourApplyInstant(tourFinal(TOUR_STEPS.length - 1));
  if (!fromSlider) { syncSliders(); $('delta').value = Math.round(TOUR.p.d / 5) * 5; }
  TOUR.on = false;
  $('tour').classList.remove('on'); document.body.classList.remove('touring');
  $('tour').appendChild(tourBody);
  document.querySelectorAll('.stack canvas').forEach(c => c.classList.remove('focus'));
  markMode(); markPreset(); pushURL();
}
$('tourGo').onclick = tourStart;
$('tourPlay').onclick = () => {
  TOUR.playing = !TOUR.playing;
  if (TOUR.playing) tourGoto(TOUR.k >= TOUR_STEPS.length - 1 ? 0 : TOUR.k);
  else { TOUR.token++; tourRender(false); }
};
$('tourPrev').onclick = () => { TOUR.playing = false; if (TOUR.k > 0) tourGoto(TOUR.k - 1); };
$('tourNext').onclick = () => { TOUR.playing = false; if (TOUR.k < TOUR_STEPS.length - 1) tourGoto(TOUR.k + 1); };
$('tourAgain').onclick = () => { TOUR.playing = true; tourGoto(0); };
$('tourClose').onclick = () => tourExit(false);
document.addEventListener('keydown', e => {
  const el = e.target instanceof Element ? e.target : document.body;
  if (!TOUR.on || el.closest('input, select, textarea')) return;
  if (e.key === ' ' && el.closest('button')) return;   // 按鈕上的空白鍵交給按鈕本身
  if (e.key === 'ArrowRight') { e.preventDefault(); $('tourNext').click(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); $('tourPrev').click(); }
  else if (e.key === ' ') { e.preventDefault(); $('tourPlay').click(); }
  else if (e.key === 'Escape') tourExit(false);
});
applyLang();
applyState(readURL());
if (new URLSearchParams(location.search).get('tour') === '1') tourStart();

// —— 主迴圈 ——
let time = 0, last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if ($('anim').checked || TOUR.on) time += dt * 6;

  if (TOUR.on) syncSliders();
  const Q = TOUR.on ? TOUR.p : null;
  LP = Q ? Math.round(Q.lp) : +$('pump').value;
  const D = Q ? Q.d : +$('delta').value, om = Q ? Q.om : +$('omega').value, g = Q ? Q.g : +$('gamma').value, nr = Q ? Q.nr : +$('nr').value;
  $('pOut').textContent = `${LP} nm (${fmt(WN(LP), 0)} cm⁻¹)`;
  $('dOut').textContent = `${Math.round(D)} cm⁻¹`;
  $('omOut').textContent = `${om} cm⁻¹`;
  $('gOut').textContent = `${g} cm⁻¹`;
  $('nrOut').textContent = nr.toFixed(2);

  const cur = scanCurve(om, g, nr);
  const target = updateStats(D, om, g, nr, cur);
  asDisp += (target - asDisp) * Math.min(1, dt * 8);

  drawBeat(D, om, g, time);
  drawSpec(D, om, g);
  drawScan(D, om, g, nr, cur);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
<script>
// 思源宋體（Noto Serif TC）是網路字型：載完後重畫一次 canvas，讓圖上的字也換成宋體
document.fonts && document.fonts.ready.then(() => {
  if (typeof redrawAll === 'function') redrawAll(); else if (typeof render === 'function') render();
});
</script>
