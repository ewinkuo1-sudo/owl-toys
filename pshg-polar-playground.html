<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P-SHG 偏振極座標遊樂場 v2.3 🦉</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14161c;
    --panel: #1d2028;
    --panel2: #262b36;
    --panel3: #2a3040;
    --input-bg: #12141a;
    --border: #232734;
    --ink: #e6e6ec;
    --muted: #9aa0ae;
    --dim: #6a7080;
    --accent: #6ec6ff;
    --ref: #ffb86c;
    --myo: #d2a8ff;
    --ix: #7ee787;
    --iy: #ff7b72;
    --data: #f5e663;
    --warn: #ffb86c;
    --grid: #2e3340;
    --pt: #ffffff;
    --on-ink: #14161c;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.28);
    --ink-rgb: 230,230,236;
    --muted-rgb: 154,160,174;
    --accent-rgb: 110,198,255;
    --ref-rgb: 255,184,108;
    --grid-rgb: 46,51,64;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f2f3f6;
    --panel: #ffffff;
    --panel2: #eceef3;
    --panel3: #e2e5ec;
    --input-bg: #f7f8fa;
    --border: #e3e6ec;
    --ink: #1c1f27;
    --muted: #5b6272;
    --dim: #8b91a0;
    --accent: #1e6fc0;
    --ref: #d4741a;
    --myo: #7648cf;
    --ix: #1f8f55;
    --iy: #c9403a;
    --data: #b8860b;
    --warn: #d4741a;
    --grid: #dfe2e9;
    --pt: #1c1f27;
    --on-ink: #ffffff;
    --shadow: 0 1px 3px rgba(20, 24, 40, 0.06);
    --ink-rgb: 28,31,39;
    --muted-rgb: 91,98,114;
    --accent-rgb: 30,111,192;
    --ref-rgb: 212,116,26;
    --grid-rgb: 223,226,233;
  }
  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable both-edges; }
  body {
    margin: 0; padding: 24px;
    background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  h1 { font-size: 1.25rem; margin: 0; font-weight: 600; }
  .titlebar { position: relative; width: 100%; max-width: 1152px; display: flex; align-items: center; justify-content: center; }
  .titlebar .btns { position: absolute; right: 0; top: 50%; transform: translateY(-50%); display: flex; gap: 6px; }
  button.chip {
    background: none; color: var(--muted); border: 1px solid var(--grid);
    border-radius: 8px; padding: 5px 9px; font-size: 0.78rem; cursor: pointer;
    font-family: inherit; line-height: 1.2; transition: border-color .12s, color .12s;
  }
  button.chip:hover { border-color: var(--muted); color: var(--ink); }
  @media (max-width: 720px) {
    .titlebar { flex-wrap: wrap; gap: 8px; }
    .titlebar .btns { position: static; transform: none; }
  }
  .sub { color: var(--muted); font-size: 0.85rem; margin: 0; max-width: 860px; text-align: center; line-height: 1.6; }
  .sub code { color: var(--accent); background: none; }
  .wrap { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; align-items: flex-start; }
  canvas { background: var(--panel); border-radius: 12px; }
  canvas, .controls, .formulabox, .helixbox {
    border: 1px solid var(--border); box-shadow: var(--shadow);
  }
  .helixbox canvas { border: none; box-shadow: none; }
  .controls {
    background: var(--panel); border-radius: 12px; padding: 18px;
    display: flex; flex-direction: column; gap: 14px; width: 320px;
  }
  .ctl label { display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 4px; }
  .ctl output { color: var(--accent); font-variant-numeric: tabular-nums; min-width: 3.6em; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--muted); }
  .toggle input { accent-color: var(--ref); }
  .presets { display: flex; gap: 8px; }
  .presets button, .expbar button {
    flex: 1; background: var(--panel2); color: var(--ink); border: 1px solid var(--grid);
    border-radius: 8px; padding: 7px 6px; font-size: 0.82rem; cursor: pointer;
    font-family: inherit;
  }
  .presets button, .expbar button { transition: border-color 0.15s ease, background 0.15s ease; }
  .presets button:hover, .expbar button:hover { border-color: var(--accent); background: var(--panel3); }
  .expbar { display: flex; gap: 8px; }
  .expmsg { font-size: 0.82rem; color: var(--data); line-height: 1.6; min-height: 0; }
  .stats { font-size: 0.83rem; color: var(--muted); line-height: 1.8; border-top: 1px solid var(--grid); padding-top: 10px; min-height: 8em; font-variant-numeric: tabular-nums; }
  .stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .stats .bias, .formulabox .bias { color: var(--warn); }
  .formulabox {
    background: var(--panel); border-radius: 12px; padding: 12px 16px;
    width: 400px; font-size: 0.8rem; line-height: 2; color: var(--muted);
    min-height: 7em; font-variant-numeric: tabular-nums;
  }
  .formulabox .f { color: var(--ink); }
  .formulabox b { color: var(--accent); font-variant-numeric: tabular-nums; }
  details.csv { font-size: 0.82rem; color: var(--muted); }
  details.csv summary { cursor: pointer; }
  details.csv textarea {
    width: 100%; margin: 8px 0 2px; background: var(--input-bg); color: var(--ink);
    border: 1px solid var(--grid); border-radius: 8px; padding: 8px;
    font-size: 0.78rem; font-family: monospace; resize: vertical;
  }
  details.csv .expbar { margin-top: 6px; }
  canvas { max-width: 100%; height: auto; }
  .controls { width: min(320px, 100%); }
  .formulabox { width: min(400px, 100%); }
  .sidecol { max-width: 100%; }
  @media (max-width: 520px) { body { padding: 12px; } }
  .legend { font-size: 0.78rem; color: var(--muted); }
  .legend span { margin-right: 10px; }
  .hint { font-size: 0.76rem; color: var(--muted); line-height: 1.6; border-top: 1px solid var(--grid); padding-top: 10px; }
  .sidecol { display: flex; flex-direction: column; gap: 16px; align-items: center; width: 400px; }
  .helixbox { background: var(--panel); border-radius: 12px; padding: 12px 12px 6px; text-align: center; width: 266px; max-width: 100%; }
  .helixbox .cap { font-size: 0.75rem; color: var(--muted); margin-top: 4px; line-height: 1.5; min-height: 4.5em; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="titlebar">
  <h1><span data-i18n="h1"></span> <span style="color:var(--muted);font-weight:400">v2.3</span></h1>
  <span class="btns">
    <button class="chip" id="lang" data-i18n-title="btn.lang.title"></button>
    <button class="chip" id="theme" data-i18n-title="btn.theme.title"></button>
  </span>
</div>
<p class="sub" data-i18n="sub"></p>
<div class="wrap">
  <div class="sidecol">
    <canvas id="polar" width="400" height="400"></canvas>
    <div class="helixbox">
      <canvas id="fiber" width="240" height="240"></canvas>
      <div class="cap" id="fiberCap"></div>
    </div>
  </div>
  <div class="sidecol">
    <canvas id="cart" width="400" height="400"></canvas>
    <div class="formulabox" id="formula"></div>
  </div>
  <div class="controls">
    <div class="presets">
      <button id="presetCol" data-i18n="preset.col"></button>
      <button id="presetMyo" data-i18n="preset.myo"></button>
    </div>
    <div class="ctl">
      <label>ρ = χ₃₃/χ₁₅ <output id="rhoOut">1.40</output></label>
      <input type="range" id="rho" min="0.2" max="4" step="0.01" value="1.4">
    </div>
    <div class="ctl">
      <label><span data-i18n="lbl.te"></span><output id="teOut">50.1°</output></label>
      <input type="range" id="te" min="36" max="72" step="0.1" value="50.1">
    </div>
    <div class="ctl">
      <label><span data-i18n="lbl.phi"></span><output id="phiOut">0°</output></label>
      <input type="range" id="phi" min="0" max="360" step="1" value="0">
    </div>
    <div class="ctl">
      <label><span data-i18n="lbl.delta"></span><output id="deltaOut">0°</output></label>
      <input type="range" id="delta" min="0" max="60" step="1" value="0">
    </div>
    <div class="ctl">
      <label><span data-i18n="lbl.c14"></span><output id="c14Out">0.00</output></label>
      <input type="range" id="c14" min="-0.6" max="0.6" step="0.01" value="0">
    </div>
    <div class="ctl">
      <label><span data-i18n="lbl.gam"></span><output id="gamOut">0°</output></label>
      <input type="range" id="gam" min="0" max="90" step="1" value="0">
    </div>
    <div class="toggle">
      <input type="checkbox" id="split">
      <label for="split" data-i18n="lbl.split"></label>
    </div>
    <div class="legend" id="legend" style="display:none">
      <span style="color:var(--ix)" data-i18n="legend.ix"></span>
      <span style="color:var(--iy)" data-i18n="legend.iy"></span>
      <span style="color:var(--accent)" data-i18n="legend.tot"></span>
    </div>
    <div class="toggle">
      <input type="checkbox" id="refCol" checked>
      <label for="refCol" data-i18n="lbl.refCol"></label>
    </div>
    <div class="toggle">
      <input type="checkbox" id="refMyo">
      <label for="refMyo" data-i18n="lbl.refMyo"></label>
    </div>
    <div class="toggle">
      <input type="checkbox" id="spin">
      <label for="spin" data-i18n="lbl.spin"></label>
    </div>
    <div class="expbar">
      <button id="expGo" data-i18n="btn.expGo"></button>
      <button id="expReveal" style="display:none" data-i18n="btn.expReveal"></button>
      <button id="expClear" style="display:none" data-i18n="btn.expClear"></button>
    </div>
    <div class="expmsg" id="expMsg"></div>
    <details class="csv">
      <summary data-i18n="csv.summary"></summary>
      <textarea id="csvIn" rows="5" data-i18n-placeholder="csv.placeholder"></textarea>
      <div class="expbar">
        <button id="csvFit" data-i18n="btn.csvFit"></button>
        <button id="csvClear" data-i18n="btn.csvClear"></button>
      </div>
      <div class="expmsg" id="csvMsg"></div>
    </details>
    <div class="stats" id="stats"></div>
    <div class="hint" data-i18n="hint"></div>
  </div>
</div>
<script>
const polar = document.getElementById('polar');
const cart = document.getElementById('cart');
const fiber = document.getElementById('fiber');
const $ = id => document.getElementById(id);

// ═══════════════════════════ 文字字典 / Strings ═══════════════════════════
// 值可以是字串，或吃參數的函式。t(key, ...args) 取用。
const SM = s => `<span style="color:var(--muted);font-size:0.72rem">${s}</span>`;
const I18N = {
zh: {
  'title': 'P-SHG 偏振極座標遊樂場 v2.3 🦉',
  'h1': 'P-SHG 偏振極座標遊樂場',
  'btn.lang.title': 'Switch to English',
  'btn.theme.title': '切換深色／淺色',
  'theme.light': '☀ 淺色', 'theme.dark': '🌙 深色',
  'sub': `纖維狀組織（C₆ 圓柱對稱）的偏振解析 SHG 模型。單軸分子模型下
    <code>ρ = χ₃₃/χ₁₅ = 2/tan²θe</code>，把花瓣形狀直接連到螺旋等效傾角 θe
    （Tiaho 2007：肌凝蛋白 θe≈62°、膠原 θe≈49°）。
    再加上出平面傾角 δ 與手性 χ₁₄——忽略這兩項正是文獻 ρ 值分歧的主因（Lee et al. 2023, APL）。
    非手性部分仍假設 Kleinman 對稱（χ₁₅ = χ₃₁）；預設收總強度，可切 X/Y 分光。`,
  'preset.col': `🩹 膠原 I 型<br>${SM('ρ=1.40, θe≈50°')}`,
  'preset.myo': `💪 肌凝蛋白<br>${SM('ρ=0.57, θe≈62°')}`,
  'lbl.te': '螺旋傾角 θe = arctan√(2/ρ)',
  'lbl.phi': '纖維方位角 φ（面內）',
  'lbl.delta': '出平面傾角 δ',
  'lbl.c14': '手性 χ₁₄/χ₁₅',
  'lbl.gam': '組織雙折射延遲 Γ（深度×Δn）',
  'lbl.split': 'X/Y 分光偵測（拆成兩個偏振分量）',
  'legend.ix': '— I_X（沿纖維）', 'legend.iy': '— I_Y（垂直）', 'legend.tot': '— 總強度',
  'lbl.refCol': '參考曲線：膠原 ρ=1.4（橘虛線）',
  'lbl.refMyo': '參考曲線：肌凝蛋白 ρ=0.57（紫虛線）',
  'lbl.spin': '讓纖維自己轉（視野裡不同走向）',
  'btn.expGo': '🎯 出題（噪聲擬合遊戲）', 'btn.expGo.short': '🎯 出題（噪聲擬合遊戲）', 'btn.expReveal': '揭曉', 'btn.expClear': '清除',
  'csv.summary': '📄 匯入實驗數據（角度°,強度）',
  'csv.placeholder': '0, 1.96\n10, 1.71\n20, 1.24\n…（逗號、空白或 tab 分隔皆可）',
  'btn.csvFit': '擬合數據', 'btn.csvClear': '清除',
  'hint': `<b>玩法提示：</b>ρ = 1 時兩個 χ 分量等強，各向異性全來自 sin²(2Δ) 交叉項——
      花變成四瓣、對比只剩 2:1，瓣尖指向纖維軸 ±45°；方向仍讀得出來，只是 ρ 不再攜帶資訊。
      實驗上是反過來：轉入射偏振拍一圈，把 I(θ) 擬合回去解出 ρ 和 φ。<br>
      <b>δ 和 χ₁₄ 在搞什麼鬼：</b>纖維翹出影像平面（δ≠0）時，
      用「天真」平面內模型去擬合會得到偏掉的表觀 ρ̂——上面 stats 會即時顯示偏差。
      手性項 χ₁₄ 在 δ=0 時輻射方向沿光軸、幾乎隱形，纖維一翹起來就現形，讓花瓣歪斜。
      這正是 Lee et al. (APL 123, 133703, 2023) 對文獻 ρ 值分歧的解釋，
      也是他們用 X/Y 分光偵測改善精度的動機。<br>
      <b>第三個坑——組織雙折射：</b>入射偏振還沒到焦點就先被組織的 Δn 扭過。
      δ=0 時解析解很乾淨：I∥ 的交叉項 ×cos2Γ，Γ=45° 時交叉項歸零、花瓣重塑。
      這個 Δn 跟 PS-OCT 量的雙折射是同一個東西——兩台儀器看同一個物理量的兩面。
      θe 對應請見 Tiaho, Recher &amp; Rouède (Opt. Express 15, 12286, 2007)。`,
  // 畫布標籤
  'polar.axis': '纖維軸',
  'cart.x': '入射偏振角 θ', 'cart.y': 'SHG 強度（χ₁₅² 單位）',
  'fiber.z': 'z 光軸', 'fiber.plane': '影像平面 x–y',
  // 3D 纖維說明
  'fc.right': '右旋（χ₁₄&gt;0）', 'fc.left': '左旋（χ₁₄&lt;0）', 'fc.none': 'χ₁₄=0（旋向不影響訊號）',
  'fc.geom': (p, d, te, hand) => `纖維幾何：φ=${p}°、δ=${d}°｜螺旋 θe=${te}°、${hand}<br>`,
  'fc.proj': '橘虛線＝纖維在影像平面上的投影（φ 方向）',
  // 公式卡
  'fm.model': `<span class="f">I(θ) ∝ (sin²Δ + ρ·cos²Δ)² + sin²2Δ</span>，<span class="f">Δ = θ − φ</span><br>`,
  'fm.subst': (r, p) => `代入現值 ρ=<b>${r}</b>、φ=<b>${p}°</b>：<span class="f">I(θ) = (sin²(θ−${p}°) + ${r}·cos²(θ−${p}°))² + sin²(2θ−${2 * p}°)</span>`,
  'fm.split': `<br><span style="color:var(--ix)">I_X = (sin²Δ + ρ·cos²Δ)²</span>　<span style="color:var(--iy)">I_Y = sin²2Δ</span>（以纖維軸為 X）`,
  'fm.biref': g => `<br><span class="f">雙折射（δ=0 時）：交叉項 2ρ·sin²Δcos²Δ × cos2Γ</span>，Γ=<b>${g}°</b>`,
  'fm.bias': v => `<br>⚠ δ、χ₁₄、Γ 有一項不為零時實際曲線偏離上式，硬擬合 → 表觀 ρ̂ = <b class="bias">${v}</b>`,
  'fm.game': `<br>🎯 遊戲＝擬合這條式：調 ρ、φ 讓曲線穿過黃點`,
  // 統計
  'st.te': te => `螺旋傾角 θe：<b>${te}°</b>（膠原~49°，肌凝蛋白~62°）<br>`,
  'st.naive': (ra, bias, teA) => `天真擬合表觀 ρ̂：<b class="bias">${ra}</b>（偏差 <b class="bias">${bias}</b>，θ̂e=${teA}°）<br>`,
  'st.resid': (v, chiral) => `天真模型擬合殘差：<b>${v}%</b>${chiral ? '（手性讓曲線歪斜，天真模型跟不上）' : ''}<br>`,
  'st.level': v => `總訊號 vs 無擾動：<b>${v}%</b>`,
  'st.unbiased': `表觀 ρ̂ = 真實 ρ（無 δ/χ₁₄/Γ 擾動，天真模型無偏）<br>`,
  'st.ratio': v => `平行/垂直強度比 I(φ)/I(φ+90°)：<b>${v}</b>（= ρ²）`,
  'st.fourier': (r2, r4) => `<br>Fourier：a₂/a₀=<b>${r2}</b>、a₄/a₀=<b>${r4}</b>`,
  // 噪聲擬合遊戲
  'ex.rms': v => `殘差 RMS：<b>${v}%</b>　`,
  'ex.answer': (r, p, mr, mp) => `<br>答案：ρ*=${r}、φ*=${p}°（你：ρ=${mr}、φ=${mp}°）`,
  'ex.good': '✓ 擬合得不錯！按「揭曉」對答案',
  'ex.drag': '拖 ρ 和 φ 讓曲線穿過黃點',
  // CSV 匯入
  'csv.need5': '至少需要 5 個「角度,強度」資料點',
  'csv.fit': (rho, p, te, rms, r2, r4) => `擬合：ρ=<b>${rho}</b>、φ=${p}°、θe=${te}°、殘差 RMS ${rms}%<br>`
    + `Fourier：a₂/a₀=${r2}、a₄/a₀=${r4}（實心圓點＝你的數據，已換算到 χ₁₅² 單位）`,
},
en: {
  'title': 'P-SHG Polar Playground v2 🦉',
  'h1': 'P-SHG Polar Playground',
  'btn.lang.title': '切換成中文',
  'btn.theme.title': 'Toggle dark / light',
  'theme.light': '☀ Light', 'theme.dark': '🌙 Dark',
  'sub': `A polarization-resolved SHG model of fibrous tissue (C₆ cylindrical symmetry). In the single-axis molecular model
    <code>ρ = χ₃₃/χ₁₅ = 2/tan²θe</code>, which ties the petal shape directly to the effective helix pitch angle θe
    (Tiaho 2007: myosin θe≈62°, collagen θe≈49°).
    On top of that come the out-of-plane tilt δ and the chirality χ₁₄; ignoring these two is the main reason ρ values scatter across the literature (Lee et al. 2023, APL).
    The achiral part still assumes Kleinman symmetry (χ₁₅ = χ₃₁); by default the total intensity is collected, with an X/Y split option.`,
  'preset.col': `🩹 Collagen I<br>${SM('ρ=1.40, θe≈50°')}`,
  'preset.myo': `💪 Myosin<br>${SM('ρ=0.57, θe≈62°')}`,
  'lbl.te': 'Helix pitch angle θe = arctan√(2/ρ)',
  'lbl.phi': 'Fiber azimuth φ (in-plane)',
  'lbl.delta': 'Out-of-plane tilt δ',
  'lbl.c14': 'Chirality χ₁₄/χ₁₅',
  'lbl.gam': 'Tissue birefringence retardance Γ (depth × Δn)',
  'lbl.split': 'X/Y split detection (two polarization components)',
  'legend.ix': '—&nbsp;I_X (along fiber)', 'legend.iy': '—&nbsp;I_Y (perpendicular)', 'legend.tot': '—&nbsp;total',
  'lbl.refCol': 'Reference: collagen ρ=1.4 (orange dashed)',
  'lbl.refMyo': 'Reference: myosin ρ=0.57 (purple dashed)',
  'lbl.spin': 'Let the fiber rotate (different orientations in the field of view)',
  'btn.expGo': '🎯 New puzzle (noisy-fit game)', 'btn.expGo.short': '🎯 New puzzle', 'btn.expReveal': 'Reveal', 'btn.expClear': 'Clear',

const RHO_COL = 1.4, RHO_MYO = 0.57;
const D2R = Math.PI / 180;

// --- 物理核心 ---------------------------------------------------------------
// C6 圓柱對稱＋單軸近似，χ15=χ31=1（歸一化單位），χ33=ρ，χ14=c14（手性）。
// 纖維軸 a 在面內方位 φ、出平面傾角 δ；入射線偏振在 xy 面、角度 θ；只偵測橫向分量。
// P = [(1−p²)+ρp²]·a + 2p·(E−p·a) + 2c14·p·(E×a)，p = E·a
// gamma = 組織雙折射相位延遲 Γ：入射偏振垂直纖維的分量相位落後 Γ → 複數場。
function fields(theta, phi, delta, rho, c14, gamma) {
  const cd = Math.cos(delta), sd = Math.sin(delta);
  const ax = cd * Math.cos(phi), ay = cd * Math.sin(phi), az = sd;
  const ex = Math.cos(theta), ey = Math.sin(theta);
  if (!gamma) {                                  // 快速實數路徑（無雙折射）
    const p = ex * ax + ey * ay;
    const lin = (1 - p * p) + rho * p * p;
    const crx = ey * az, cry = -ex * az;         // (E×a) 的橫向分量
    const Px = lin * ax + 2 * p * (ex - p * ax) + 2 * c14 * p * crx;
    const Py = lin * ay + 2 * p * (ey - p * ay) + 2 * c14 * p * cry;
    return [Px * Px, Py * Py];
  }
  // 複數路徑：E' = (E·u)u + e^{iΓ}(E·v)v，u=面內纖維方向、v=面內垂直方向
  const ux = Math.cos(phi), uy = Math.sin(phi), vx = -uy, vy = ux;
  const Eu = ex * ux + ey * uy, Ev = ex * vx + ey * vy;
  const cg = Math.cos(gamma), sg = Math.sin(gamma);
  const Exr = Eu * ux + cg * Ev * vx, Exi = sg * Ev * vx;
  const Eyr = Eu * uy + cg * Ev * vy, Eyi = sg * Ev * vy;
  const pr = Exr * ax + Eyr * ay, pi = Exi * ax + Eyi * ay;
  const p2r = pr * pr - pi * pi, p2i = 2 * pr * pi;      // SHG 為非共軛乘積
  const Epxr = Exr - pr * ax, Epxi = Exi - pi * ax;
  const Epyr = Eyr - pr * ay, Epyi = Eyi - pi * ay;
  const Epzr = -pr * az, Epzi = -pi * az;
  const Ep2r = Epxr * Epxr - Epxi * Epxi + Epyr * Epyr - Epyi * Epyi + Epzr * Epzr - Epzi * Epzi;
  const Ep2i = 2 * (Epxr * Epxi + Epyr * Epyi + Epzr * Epzi);
  const linr = Ep2r + rho * p2r, lini = Ep2i + rho * p2i;
  const pmul = (br, bi) => [pr * br - pi * bi, pr * bi + pi * br];
  const [t2xr, t2xi] = pmul(Epxr, Epxi);
  const [t2yr, t2yi] = pmul(Epyr, Epyi);
  const [t3xr, t3xi] = pmul(Eyr * az, Eyi * az);
  const [t3yr, t3yi] = pmul(-Exr * az, -Exi * az);
  const PxR = linr * ax + 2 * t2xr + 2 * c14 * t3xr;
  const PxI = lini * ax + 2 * t2xi + 2 * c14 * t3xi;
  const PyR = linr * ay + 2 * t2yr + 2 * c14 * t3yr;
  const PyI = lini * ay + 2 * t2yi + 2 * c14 * t3yi;
  return [PxR * PxR + PxI * PxI, PyR * PyR + PyI * PyI];
}

function curveFull(phi, delta, rho, c14, gamma = 0, n = 720) {
  const pts = []; let max = 0;
  for (let i = 0; i <= n; i++) {
    const t = i / n * 2 * Math.PI;
    const [Ix, Iy] = fields(t, phi, delta, rho, c14, gamma);
    const It = Ix + Iy;
    if (It > max) max = It;
    pts.push([t, Ix, Iy, It]);
  }
  return { pts, max };
}

// Fourier 分解：I(θ) 的 0/2θ/4θ 分量（文獻常用管線，對噪聲比逐點擬合穩）
function fourier(pts) {
  let c0 = 0, c2r = 0, c2i = 0, c4r = 0, c4i = 0;
  for (const [t, I] of pts) {
    c0 += I;
    c2r += I * Math.cos(2 * t); c2i += I * Math.sin(2 * t);
    c4r += I * Math.cos(4 * t); c4i += I * Math.sin(4 * t);
  }
  const N = pts.length;
  c0 /= N;
  return {
    c0,
    r2: 2 * Math.hypot(c2r, c2i) / N / (c0 || 1),
    r4: 2 * Math.hypot(c4r, c4i) / N / (c0 || 1),
    phi2: Math.atan2(c2i, c2r) / 2,
  };
}

// 對任意 (角度, 強度) 數據做天真模型全域擬合：粗掃 φ×ρ ＋ 交替細化
function fitData(pts) {
  const evalFit = (ra, ph) => {
    let sf2 = 0, sfi = 0;
    for (const [t, I] of pts) { const m = naiveI(t, ph, ra); sf2 += m * m; sfi += m * I; }
    const A = sf2 > 0 ? sfi / sf2 : 0;
    let sse = 0;
    for (const [t, I] of pts) { const r = I - A * naiveI(t, ph, ra); sse += r * r; }
    return { sse, A };
  };
  let best = null;
  for (let j = 0; j < 90; j++) {
    const ph = j * 2 * D2R;                      // 曲線有 180° 週期，掃 0–180° 即可
    for (let i = 0; i <= 60; i++) {
      const ra = 0.1 * Math.pow(5 / 0.1, i / 60);
      const r = evalFit(ra, ph);
      if (!best || r.sse < best.sse) best = { sse: r.sse, A: r.A, rho: ra, phi: ph };
    }
  }
  for (let k = 0; k < 3; k++) {
    for (let i = -20; i <= 20; i++) {
      const ra = Math.max(0.05, best.rho * (1 + i / 200));
      const r = evalFit(ra, best.phi);
      if (r.sse < best.sse) Object.assign(best, { sse: r.sse, A: r.A, rho: ra });
    }
    for (let i = -20; i <= 20; i++) {
      const ph = best.phi + i * 0.1 * D2R;
      const r = evalFit(best.rho, ph);
      if (r.sse < best.sse) Object.assign(best, { sse: r.sse, A: r.A, phi: ph });
    }
  }
  let sumI2 = 0;
  for (const [, I] of pts) sumI2 += I * I;
  best.rms = sumI2 > 0 ? Math.sqrt(best.sse / sumI2) : 0;
  best.fourier = fourier(pts);
  return best;
}

function parseCSV(text) {
  const pts = [];
  for (const line of text.split(/[\n\r]+/)) {
    const nums = line.split(/[,;\t ]+/).map(parseFloat).filter(x => isFinite(x));
    if (nums.length >= 2) pts.push([nums[0] * D2R, nums[1]]);
  }
  return pts;
}

// 天真平面內模型（v1 的公式）
function naiveI(theta, phi, rho) {
  const d = theta - phi, s = Math.sin(d), c = Math.cos(d);
  const a = Math.sin(2 * d), b = s * s + rho * c * c;
  return a * a + b * b;
}

// 用天真模型對「真實」曲線做最小平方擬合，解出表觀 ρ̂
function fitNaive(phi, delta, rho, c14, gamma) {
  const N = 180, data = new Float64Array(N), th = new Float64Array(N);
  let sumI2 = 0;
  for (let k = 0; k < N; k++) {
    th[k] = k / N * 2 * Math.PI;
    const [Ix, Iy] = fields(th[k], phi, delta, rho, c14, gamma);
    data[k] = Ix + Iy;
    sumI2 += data[k] * data[k];
  }
  const cost = ra => {
    let sf2 = 0, sfi = 0;
    for (let k = 0; k < N; k++) {
      const f = naiveI(th[k], phi, ra);
      sf2 += f * f; sfi += f * data[k];
    }
    const A = sf2 > 0 ? sfi / sf2 : 0;
    let sse = 0;
    for (let k = 0; k < N; k++) {
      const r = data[k] - A * naiveI(th[k], phi, ra);
      sse += r * r;
    }
    return sse;
  };
  let best = 0.05, bestC = Infinity;
  for (let i = 0; i <= 120; i++) {                       // 粗掃（對數間距）
    const ra = 0.05 * Math.pow(6 / 0.05, i / 120);
    const c = cost(ra);
    if (c < bestC) { bestC = c; best = ra; }
  }
  const lo = best * 0.9, hi = best * 1.1;
  for (let i = 0; i <= 60; i++) {                        // 細掃
    const ra = lo + (hi - lo) * i / 60;
    const c = cost(ra);
    if (c < bestC) { bestC = c; best = ra; }
  }
  return { rhoA: best, resid: sumI2 > 0 ? Math.sqrt(bestC / sumI2) : 0 };
}

const thetaE = rho => Math.atan(Math.sqrt(2 / rho)) / D2R;
const rhoOf = te => 2 / Math.pow(Math.tan(te * D2R), 2);

// --- 極座標圖 ---------------------------------------------------------------
function tracePolar(pts, idx, norm, cx, cy, R, color, lw, dashed) {
  pctx.strokeStyle = color;
  pctx.lineWidth = lw;
  if (dashed) pctx.setLineDash([4, 4]);
  pctx.beginPath();
  pts.forEach((pt, i) => {
    const t = pt[0], r = R * pt[idx] / norm;
    const x = cx + r * Math.cos(t), y = cy - r * Math.sin(t);
    i ? pctx.lineTo(x, y) : pctx.moveTo(x, y);
  });
  pctx.stroke();
  pctx.setLineDash([]);
}

function drawPolar(st) {
  const w = POLAR_W, h = POLAR_H, cx = w / 2, cy = h / 2, R = w / 2 - 36;
  pctx.clearRect(0, 0, w, h);

  pctx.strokeStyle = C.grid;
  pctx.fillStyle = C.muted;
  pctx.font = '11px sans-serif';
  pctx.lineWidth = 1;
  for (const f of [0.25, 0.5, 0.75, 1]) {
    pctx.beginPath(); pctx.arc(cx, cy, R * f, 0, 2 * Math.PI); pctx.stroke();
  }
  for (let a = 0; a < 180; a += 30) {
    const t = a * D2R;
    pctx.beginPath();
    pctx.moveTo(cx - R * Math.cos(t), cy + R * Math.sin(t));
    pctx.lineTo(cx + R * Math.cos(t), cy - R * Math.sin(t));
    pctx.stroke();
    pctx.fillText(a + '°', cx + (R + 8) * Math.cos(t) - 8, cy - (R + 8) * Math.sin(t) + 4);
  }

  if (st.refCol) {
    const ref = curveFull(st.phi, 0, RHO_COL, 0);
    tracePolar(ref.pts, 3, ref.max, cx, cy, R, C.ref, 1.4, true);
  }
  if (st.refMyo) {
    const ref = curveFull(st.phi, 0, RHO_MYO, 0);
    tracePolar(ref.pts, 3, ref.max, cx, cy, R, C.myo, 1.4, true);
  }

  const main = st.main;
  if (st.split) {
    tracePolar(main.pts, 3, main.max, cx, cy, R, rgba(C.accentRgb, 0.35), 1.5, false);
    tracePolar(main.pts, 1, main.max, cx, cy, R, C.ix, 2, false);
    tracePolar(main.pts, 2, main.max, cx, cy, R, C.iy, 2, false);
  } else {
    tracePolar(main.pts, 3, main.max, cx, cy, R, C.accent, 2.5, false);
  }

  if (st.exp) {
    pctx.fillStyle = C.data;
    for (const [t, v] of st.exp.pts) {
      const r = R * v;
      pctx.beginPath();
      pctx.arc(cx + r * Math.cos(t), cy - r * Math.sin(t), 2.5, 0, 2 * Math.PI);
      pctx.fill();
    }
  }
  if (st.csv) {
    pctx.fillStyle = C.pt;
    for (const [t, v] of st.csv.pts) {
      const r = R * Math.min(1.1, v / main.max);
      pctx.beginPath();
      pctx.arc(cx + r * Math.cos(t), cy - r * Math.sin(t), 2.5, 0, 2 * Math.PI);
      pctx.fill();
    }
  }

  pctx.strokeStyle = C.ink;
  pctx.setLineDash([6, 6]);
  pctx.lineWidth = 1;
  pctx.beginPath();
  pctx.moveTo(cx - R * Math.cos(st.phi), cy + R * Math.sin(st.phi));
  pctx.lineTo(cx + R * Math.cos(st.phi), cy - R * Math.sin(st.phi));
  pctx.stroke();
  pctx.setLineDash([]);
  pctx.fillStyle = C.ink;
  pctx.fillText(t('polar.axis'), cx + (R - 40) * Math.cos(st.phi), cy - (R - 40) * Math.sin(st.phi) - 8);
}

// --- 直角座標圖 -------------------------------------------------------------
function drawCart(st) {
  const w = CART_W, h = CART_H, mL = 46, mB = 34, mT = 18, mR = 12;
  const pw = w - mL - mR, ph = h - mT - mB;
  cctx.clearRect(0, 0, w, h);

  const refC = st.refCol ? curveFull(st.phi, 0, RHO_COL, 0, 0, 360) : null;
  const refM = st.refMyo ? curveFull(st.phi, 0, RHO_MYO, 0, 0, 360) : null;
  const main = curveFull(st.phi, st.delta, st.rho, st.c14, st.gamma, 360);
  let yMax = main.max;
  if (refC) yMax = Math.max(yMax, refC.max);
  if (refM) yMax = Math.max(yMax, refM.max);
  if (st.exp) yMax = Math.max(yMax, st.exp.max * 1.1);
  if (st.csv) for (const [, v] of st.csv.pts) yMax = Math.max(yMax, v);
  yMax *= 1.05;

  cctx.strokeStyle = C.grid;
  cctx.fillStyle = C.muted;
  cctx.font = '11px sans-serif';
  cctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const y = mT + ph - ph * g / 4;
    cctx.beginPath(); cctx.moveTo(mL, y); cctx.lineTo(w - mR, y); cctx.stroke();
    cctx.fillText((yMax * g / 4).toFixed(1), 8, y + 4);
  }
  for (let a = 0; a <= 360; a += 90) {
    const x = mL + pw * a / 360;
    cctx.beginPath(); cctx.moveTo(x, mT); cctx.lineTo(x, mT + ph); cctx.stroke();
    cctx.fillText(a + '°', x - 10, h - 12);
  }
  const xl = t('cart.x'), yl = t('cart.y');
  cctx.fillText(xl, mL + pw / 2 - cctx.measureText(xl).width / 2, h - 0.5);
  cctx.save();
  cctx.translate(12, mT + ph / 2 + cctx.measureText(yl).width / 2); cctx.rotate(-Math.PI / 2);
  cctx.fillText(yl, 0, 0);
  cctx.restore();

  const trace = (pts, idx, color, lw, dashed) => {
    cctx.strokeStyle = color; cctx.lineWidth = lw;
    if (dashed) cctx.setLineDash([4, 4]);
    cctx.beginPath();
    pts.forEach((pt, i) => {
      const x = mL + pw * pt[0] / (2 * Math.PI);
      const y = mT + ph - ph * pt[idx] / yMax;
      i ? cctx.lineTo(x, y) : cctx.moveTo(x, y);
    });
    cctx.stroke();
    cctx.setLineDash([]);
  };
  if (refC) trace(refC.pts, 3, C.ref, 1.4, true);
  if (refM) trace(refM.pts, 3, C.myo, 1.4, true);
  if (st.split) {
    trace(main.pts, 3, rgba(C.accentRgb, 0.35), 1.5, false);
    trace(main.pts, 1, C.ix, 2, false);
    trace(main.pts, 2, C.iy, 2, false);
  } else {
    trace(main.pts, 3, C.accent, 2.5, false);
  }

  if (st.exp) {
    cctx.fillStyle = C.data;
    for (const [t, v] of st.exp.pts) {
      const x = mL + pw * t / (2 * Math.PI);
      const y = mT + ph - ph * (v * st.exp.max) / yMax;
      cctx.beginPath(); cctx.arc(x, y, 2.5, 0, 2 * Math.PI); cctx.fill();
    }
  }
  if (st.csv) {
    cctx.fillStyle = C.pt;
    for (const [t, v] of st.csv.pts) {
      const x = mL + pw * t / (2 * Math.PI);
      const y = mT + ph - ph * v / yMax;
      cctx.beginPath(); cctx.arc(x, y, 2.5, 0, 2 * Math.PI); cctx.fill();
    }
  }
}

// --- 3D 纖維示意圖 ----------------------------------------------------------
// z = 光軸、xy = 影像平面。纖維（圓柱＋螺旋條紋）方位 φ、翹角 δ，
// 螺旋傾角 = θe，旋向隨 χ₁₄ 正負翻轉；橘虛線是纖維在影像平面上的投影。
function drawFiber(st, teDeg) {
  const w = FIBER_W, h = FIBER_H, cx = w / 2, cy = h / 2 + 14, S = 54;
  fctx.clearRect(0, 0, w, h);
  const psi = 25 * D2R, eps = 28 * D2R;
  const cp = Math.cos(psi), sp = Math.sin(psi), ce = Math.cos(eps), se = Math.sin(eps);
  const P = (x, y, z) => {
    const x1 = x * cp - y * sp, y1 = x * sp + y * cp;
    return [cx + S * x1, cy - S * (y1 * se + z * ce), -y1 * ce + z * se];
  };

  fctx.lineWidth = 1;
  fctx.strokeStyle = rgba(C.gridRgb, 0.9);
  for (let g = -2; g <= 2; g++) {
    const q = g * 0.5;
    let a0 = P(q, -1, 0), b0 = P(q, 1, 0);
    fctx.beginPath(); fctx.moveTo(a0[0], a0[1]); fctx.lineTo(b0[0], b0[1]); fctx.stroke();
    a0 = P(-1, q, 0); b0 = P(1, q, 0);
    fctx.beginPath(); fctx.moveTo(a0[0], a0[1]); fctx.lineTo(b0[0], b0[1]); fctx.stroke();
  }
  const z0 = P(0, 0, 0), z1 = P(0, 0, 1.05);
  fctx.strokeStyle = rgba(C.mutedRgb, 0.5);
  fctx.setLineDash([3, 4]);
  fctx.beginPath(); fctx.moveTo(z0[0], z0[1]); fctx.lineTo(z1[0], z1[1]); fctx.stroke();
  fctx.setLineDash([]);
  fctx.fillStyle = C.muted;
  fctx.font = '10px sans-serif';
  fctx.fillText(t('fiber.z'), z1[0] + 4, z1[1] + 3);
  fctx.fillText(t('fiber.plane'), 8, h - 8);

  const cd = Math.cos(st.delta), sd = Math.sin(st.delta);
  const a = [cd * Math.cos(st.phi), cd * Math.sin(st.phi), sd];
  const n1 = [-Math.sin(st.phi), Math.cos(st.phi), 0];
  const n2 = [a[1] * n1[2] - a[2] * n1[1], a[2] * n1[0] - a[0] * n1[2], a[0] * n1[1] - a[1] * n1[0]];
  const L = 0.85, r = 0.17;
  const czv = L * sd;                       // 抬高讓下端剛好落在影像平面上

  const s0 = P(-L * a[0], -L * a[1], 0), s1 = P(L * a[0], L * a[1], 0);
  fctx.strokeStyle = rgba(C.refRgb, 0.55);
  fctx.setLineDash([5, 4]);
  fctx.lineWidth = 1.4;
  fctx.beginPath(); fctx.moveTo(s0[0], s0[1]); fctx.lineTo(s1[0], s1[1]); fctx.stroke();
  fctx.setLineDash([]);

  const e0 = P(-L * a[0], -L * a[1], czv - L * a[2]);
  const e1 = P(L * a[0], L * a[1], czv + L * a[2]);
  fctx.strokeStyle = rgba(C.accentRgb, 0.18);
  fctx.lineWidth = 2 * r * S;
  fctx.lineCap = 'round';
  fctx.beginPath(); fctx.moveTo(e0[0], e0[1]); fctx.lineTo(e1[0], e1[1]); fctx.stroke();
  fctx.lineCap = 'butt';

  const hand = st.c14 < 0 ? -1 : 1;
  const chiral = Math.abs(st.c14) > 1e-6;
  const pitchV = r / Math.tan(teDeg * D2R);
  const T = 2 * L / pitchV;
  const n = Math.min(1400, Math.max(240, Math.round(T / 0.06)));
  const pass = front => {
    fctx.strokeStyle = front
      ? (chiral ? C.accent : rgba(C.mutedRgb, 0.9))
      : (chiral ? rgba(C.accentRgb, 0.25) : rgba(C.mutedRgb, 0.25));
    fctx.lineWidth = front ? 2.2 : 1.1;
    let drawing = false;
    fctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const t = T * i / n;
      const s = -L + pitchV * t;
      const ca = Math.cos(hand * t), sa = Math.sin(hand * t);
      const px = s * a[0] + r * (ca * n1[0] + sa * n2[0]);
      const py = s * a[1] + r * (ca * n1[1] + sa * n2[1]);
      const pz = czv + s * a[2] + r * (ca * n1[2] + sa * n2[2]);
      const axP = P(s * a[0], s * a[1], czv + s * a[2]);
      const q = P(px, py, pz);
      if ((q[2] >= axP[2]) === front) {
        if (!drawing) { fctx.moveTo(q[0], q[1]); drawing = true; }
        else fctx.lineTo(q[0], q[1]);
      } else drawing = false;
    }
    fctx.stroke();
  };
  pass(false);
  pass(true);
}

function fiberCap(st, te) {
  const handTxt = Math.abs(st.c14) > 1e-6
    ? (st.c14 > 0 ? t('fc.right') : t('fc.left'))
    : t('fc.none');
  return t('fc.geom', Math.round(phiDeg), Math.round(st.delta / D2R), te.toFixed(1), handTxt)
       + `<span style="color:var(--dim)">${t('fc.proj')}</span>`;
}

// --- 公式板 -----------------------------------------------------------------
function formulaHTML(st, fit) {
  const p = Math.round(phiDeg), r = st.rho.toFixed(2);
  let s = t('fm.model');
  s += t('fm.subst', r, p);
  if (st.split) s += t('fm.split');
  if (st.gamma > 1e-6) s += t('fm.biref', Math.round(st.gamma / D2R));
  if (fit) s += t('fm.bias', fit.rhoA.toFixed(2));
  else if (exp) s += t('fm.game');
  return s;
}

// --- 實驗模式（噪聲擬合遊戲） ----------------------------------------------
let exp = null, csv = null;
let csvMsg = null;                                  // { k, args }：最後一則 CSV 訊息，切語言時重生
function showCsvMsg() { const el = $('csvMsg'); if (el) el.innerHTML = csvMsg ? t(csvMsg.k, ...csvMsg.args) : ''; }
const randn = () => {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
};

function makeExperiment() {
  const rho = 0.4 + Math.random() * 2.1;
  const phi = Math.random() * Math.PI;
  const full = curveFull(phi, 0, rho, 0, 0, 720);
  const pts = [];
  for (let a = 0; a < 360; a += 5) {
    const t = a * D2R;
    const [Ix, Iy] = fields(t, phi, 0, rho, 0, 0);
    const In = (Ix + Iy) / full.max;
    const noisy = Math.max(0, In + (0.03 + 0.05 * Math.sqrt(In)) * randn());
    pts.push([t, noisy]);
  }
  return { rho, phi, pts, max: full.max, revealed: false };
}

function expRms(st) {
  const cur = curveFull(st.phi, st.delta, st.rho, st.c14, st.gamma, 720);
  let sse = 0;
  for (const [t, v] of exp.pts) {
    const [Ix, Iy] = fields(t, st.phi, st.delta, st.rho, st.c14, st.gamma);
    sse += Math.pow((Ix + Iy) / cur.max - v, 2);
  }
  return Math.sqrt(sse / exp.pts.length);
}

// --- 狀態與渲染 -------------------------------------------------------------
let spinning = false, phiDeg = 0, raf = null, lastTick = 0;

function state() {
  return {
    rho: parseFloat($('rho').value),
    phi: phiDeg * D2R,
    delta: parseFloat($('delta').value) * D2R,
    c14: parseFloat($('c14').value),
    gamma: parseFloat($('gam').value) * D2R,
    split: $('split').checked,
    refCol: $('refCol').checked,
    refMyo: $('refMyo').checked,
    exp,
    csv,
  };
}

function render() {
  const st = state();
  st.main = curveFull(st.phi, st.delta, st.rho, st.c14, st.gamma);
  const te = thetaE(st.rho);

  $('rhoOut').textContent = st.rho.toFixed(2);
  $('teOut').textContent = te.toFixed(1) + '°';
  $('phiOut').textContent = Math.round(phiDeg) + '°';
  $('deltaOut').textContent = Math.round(st.delta / D2R) + '°';
  $('c14Out').textContent = st.c14.toFixed(2);
  $('gamOut').textContent = Math.round(st.gamma / D2R) + '°';
  $('legend').style.display = st.split ? 'block' : 'none';
  $('expGo').innerHTML = t(exp ? 'btn.expGo.short' : 'btn.expGo');   // 三顆按鈕並排時英文用短版

  drawPolar(st);
  drawCart(st);
  drawFiber(st, te);

  const perturbed = st.delta > 1e-6 || Math.abs(st.c14) > 1e-6 || st.gamma > 1e-6;
  const fit = perturbed ? fitNaive(st.phi, st.delta, st.rho, st.c14, st.gamma) : null;
  $('formula').innerHTML = formulaHTML(st, fit);
  $('fiberCap').innerHTML = fiberCap(st, te);

  let s = t('st.te', te.toFixed(1));
  if (perturbed) {
    const teA = thetaE(fit.rhoA);
    const bias = (fit.rhoA / st.rho - 1) * 100;
    const flat = curveFull(st.phi, 0, st.rho, st.c14, 0, 360);
    let sig = 0, sig0 = 0;
    for (const p of st.main.pts) sig += p[3];
    for (const p of flat.pts) sig0 += p[3];
    const lvl = sig / st.main.pts.length / (sig0 / flat.pts.length) * 100;
    s += t('st.naive', fit.rhoA.toFixed(2), `${bias >= 0 ? '+' : ''}${bias.toFixed(0)}%`, teA.toFixed(1))
       + t('st.resid', (fit.resid * 100).toFixed(1), Math.abs(st.c14) > 1e-6 && st.delta > 1e-6)
       + t('st.level', lvl.toFixed(0));
  } else {
    s += t('st.unbiased') + t('st.ratio', (st.rho * st.rho).toFixed(2));
  }
  const fr = fourier(st.main.pts.map(p => [p[0], p[3]]));
  s += t('st.fourier', fr.r2.toFixed(2), fr.r4.toFixed(2));
  $('stats').innerHTML = s;

  if (exp) {
    const rms = expRms(st);
    let m = t('ex.rms', (rms * 100).toFixed(1));
    if (exp.revealed) {
      m += t('ex.answer', exp.rho.toFixed(2), Math.round(exp.phi / D2R), st.rho.toFixed(2), Math.round(phiDeg));
    } else if (rms < 0.05) {
      m += t('ex.good');
    } else {
      m += t('ex.drag');
    }
    $('expMsg').innerHTML = m;
  } else {
    $('expMsg').innerHTML = '';
  }
}

function setRho(r) {
  r = Math.min(4, Math.max(0.2, r));
  $('rho').value = r;
  $('te').value = thetaE(r).toFixed(1);
  render();
}

// --- 事件 -------------------------------------------------------------------
$('rho').addEventListener('input', () => { $('te').value = thetaE(parseFloat($('rho').value)).toFixed(1); render(); });
$('te').addEventListener('input', () => { $('rho').value = rhoOf(parseFloat($('te').value)).toFixed(2); render(); });
$('phi').addEventListener('input', e => { phiDeg = parseFloat(e.target.value); render(); });
for (const id of ['delta', 'c14', 'gam']) $(id).addEventListener('input', render);
for (const id of ['split', 'refCol', 'refMyo']) $(id).addEventListener('change', render);
$('presetCol').addEventListener('click', () => setRho(RHO_COL));
$('presetMyo').addEventListener('click', () => setRho(RHO_MYO));

$('spin').addEventListener('change', e => {
  spinning = e.target.checked;
  if (spinning) { lastTick = 0; raf = requestAnimationFrame(tick); }
  else cancelAnimationFrame(raf);
});
// 以時間為基準（24°/s），任何螢幕更新率下轉速一致
function tick(ts) {
  if (!spinning) return;
  if (lastTick) phiDeg = (phiDeg + 24 * Math.min(100, ts - lastTick) / 1000) % 360;
  lastTick = ts;
  $('phi').value = phiDeg;
  render();
  raf = requestAnimationFrame(tick);
}

$('expGo').addEventListener('click', () => {
  exp = makeExperiment();
  $('delta').value = 0;                  // 遊戲出題假設 δ=0、無手性、無雙折射
  $('c14').value = 0;
  $('gam').value = 0;
  $('expReveal').style.display = '';
  $('expClear').style.display = '';
  render();
});
$('expReveal').addEventListener('click', () => { if (exp) { exp.revealed = true; render(); } });
$('csvFit').addEventListener('click', () => {
  const pts = parseCSV($('csvIn').value);
  if (pts.length < 5) { csvMsg = { k: 'csv.need5', args: [] }; showCsvMsg(); return; }
  const fit = fitData(pts);
  csv = { pts: pts.map(([t, I]) => [t, fit.A > 0 ? I / fit.A : I]) };
  $('delta').value = 0; $('c14').value = 0; $('gam').value = 0;
  phiDeg = ((fit.phi / D2R) % 360 + 360) % 360;
  $('phi').value = phiDeg;
  csvMsg = { k: 'csv.fit', args: [fit.rho.toFixed(2), Math.round(phiDeg), thetaE(fit.rho).toFixed(1),
    (fit.rms * 100).toFixed(1), fit.fourier.r2.toFixed(2), fit.fourier.r4.toFixed(2)] };
  showCsvMsg();
  setRho(fit.rho);
});
$('csvClear').addEventListener('click', () => { csv = null; csvMsg = null; showCsvMsg(); render(); });
$('expClear').addEventListener('click', () => {
  exp = null;
  $('expReveal').style.display = 'none';
  $('expClear').style.display = 'none';
  render();
});

applyLang();
booted = true;
render();
</script>
</body>
</html>
