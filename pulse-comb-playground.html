<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>脈衝串 ↔ 頻率梳遊樂場 🦉</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14161c; --panel: #1d2028; --ink: #e6e6ec; --muted: #9aa0ae;
    --accent: #6ec6ff; --comb: #6ec6ff; --sum: #7ee787; --life: #ffb86c;
    --mark1: #7ee787; --mark2: #ff7eb6; --grid: #2e3340;
    --btn: #262b36;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f2f3f6; --panel: #ffffff; --ink: #1c1f27; --muted: #5b6272;
    --accent: #1e6fc0; --comb: #1e6fc0; --sum: #1f8f55; --life: #d4741a;
    --mark1: #1f8f55; --mark2: #c2316f; --grid: #dfe2e9;
    --btn: #eceef3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .head { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.25rem; margin: 0; font-weight: 600; }
  button.chip {
    background: none; color: var(--muted); border: 1px solid var(--grid);
    border-radius: 8px; padding: 5px 9px; font-size: 0.78rem; cursor: pointer;
    font-family: inherit; line-height: 1.2; transition: border-color .12s, color .12s;
  }
  button.chip:hover { border-color: var(--muted); color: var(--ink); }
  p.sub { color: var(--muted); font-size: 0.85rem; margin: 0; max-width: 760px; text-align: center; line-height: 1.7; }
  p.sub code { color: var(--accent); }
  .wrap { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .panel { background: var(--panel); border-radius: 12px; padding: 14px; }
  .panel h2 { font-size: 0.92rem; margin: 0 0 8px 4px; font-weight: 600; color: var(--ink); max-width: 556px; line-height: 1.4; }
  canvas { display: block;  max-width: 100%; height: auto; }
  .controls { background: var(--panel); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 15px; width: 300px; }
  :root[data-theme="light"] .panel, :root[data-theme="light"] .controls { box-shadow: 0 1px 3px rgba(20,24,40,0.06); }
  .ctl label { display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 5px; }
  .ctl output { color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; }
  .presets button {
    background: var(--btn); color: var(--ink); border: 1px solid var(--grid);
    border-radius: 8px; padding: 6px 10px; font-size: 0.8rem; cursor: pointer;
    font-family: inherit;
  }
  .presets button:hover { border-color: var(--life); }
  .stats { font-size: 0.84rem; color: var(--muted); line-height: 1.9; border-top: 1px solid var(--grid); padding-top: 10px; }
  .stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .stats .g { color: var(--mark1); } .stats .p { color: var(--mark2); } .stats .o { color: var(--life); }
  .hint { font-size: 0.78rem; color: var(--muted); line-height: 1.7; border-top: 1px solid var(--grid); padding-top: 10px; }
  @media (max-width: 520px) {
    body { padding: 12px; }
    .controls, .panel { width: 100%; max-width: 100%; min-width: 0; }
  }
</style>
</head>
<body>
<div class="head">
  <h1 data-i18n="title"></h1>
  <button class="chip" id="lang" data-i18n-title="btn.lang.title"></button>
  <button class="chip" id="theme" data-i18n-title="btn.theme.title"></button>
</div>
<p class="sub" data-i18n="sub"></p>
<div class="wrap">
  <div class="col">
    <div class="panel">
      <h2 data-i18n="panel.time"></h2>
      <canvas id="time" width="560" height="230"></canvas>
    </div>
    <div class="panel">
      <h2 data-i18n="panel.freq"></h2>
      <canvas id="freq" width="560" height="250"></canvas>
    </div>
  </div>
  <div class="controls">
    <div class="ctl">
      <label><span data-i18n="lbl.frep"></span> <output id="frepOut">40 MHz</output></label>
      <input type="range" id="frep" min="10" max="160" step="1" value="40">
    </div>
    <div class="ctl">
      <label><span data-i18n="lbl.wid"></span> <output id="widOut">2%</output></label>
      <input type="range" id="wid" min="0.5" max="18" step="0.1" value="2">
    </div>
    <div class="ctl">
      <label><span data-i18n="lbl.nh"></span> <output id="nOut">8</output></label>
      <input type="range" id="nh" min="1" max="24" step="1" value="8">
    </div>
    <div class="ctl">
      <label><span data-i18n="lbl.tau"></span> <output id="tauOut">2.5 ns</output></label>
      <input type="range" id="tau" min="0" max="6" step="0.05" value="2.5">
    </div>
    <div class="presets">
      <button data-tau="0.4" data-i18n="preset.free"></button>
      <button data-tau="2.5" data-i18n="preset.bound"></button>
      <button data-tau="0" data-i18n="preset.none"></button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="hint" data-i18n="hint"></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);

// ═══════════════════════════ 文字字典 / Strings ═══════════════════════════
// 值可以是字串，或吃參數的函式。t(key, ...args) 取用。
const I18N = {
zh: {
  'title': '脈衝串 ↔ 頻率梳遊樂場',
  'doc.title': '脈衝串 ↔ 頻率梳遊樂場 🦉',
  'btn.lang.title': 'Switch to English',
  'btn.theme.title': '切換深色／淺色',
  'theme.light': '☀ 淺色', 'theme.dark': '🌙 深色',
  'sub': `週期 <code>T</code> 的脈衝串 ⇔ 間距 <code>1/T</code> 的頻率梳。左上：時域脈衝串與「疊諧波長出尖脈衝」；
    左下：頻域梳齒、螢光壽命低通 <code>m = 1/√(1+(2πfτ)²)</code>，與 1f／2f 取頻位置。
    拉拉看：脈衝越尖梳齒延伸越遠；τ 越長，高次梳齒被壓得越扁。`,
  'panel.time': '時域：脈衝串（藍）＋ 前 N 個諧波的疊加（綠）',
  'panel.freq': '頻域：梳齒（藍）× 螢光低通（橘）＝ 實際聽到的（實心）',
  'lbl.frep': '重複率 f<sub>rep</sub>',
  'lbl.wid': '脈衝寬度（σ/T）',
  'lbl.nh': '疊加諧波數 N',
  'lbl.tau': '螢光壽命 τ',
  'preset.free': 'NADH 自由態 0.4 ns',
  'preset.bound': 'NADH 結合態 2.5 ns',
  'preset.none': '無壽命（τ=0）',
  'stats': s =>
    `梳齒（雷射端）｜<span class="g">1f</span>：<b>${s.c1}%</b>　<span class="p">2f</span>：<b>${s.c2}%</b><br>` +
    `<span class="o">壽命低通 m</span>｜<span class="g">1f</span>：<b>${s.m1}%</b>　<span class="p">2f</span>：<b>${s.m2}%</b>` +
    `（虧 <b>${s.loss}×</b>）<br>` +
    `實際聽到｜<span class="g">1f</span>：<b>${s.h1}%</b>　<span class="p">2f</span>：<b>${s.h2}%</b><br>` +
    `相位 φ = arctan(2πfτ)｜<span class="g">1f</span>：<b>${s.p1}°</b>　<span class="p">2f</span>：<b>${s.p2}°</b><br>` +
    `NADH 兩態相位差｜<span class="g">1f</span>：<b>${s.gap1}°</b> → <span class="p">2f</span>：<b>${s.gap2}°</b>`,
  'hint': `玩法提示：① N 拉到 1 是純弦波，8 開始像尖脈衝——「2f 是梳子天生的第二根齒」。
    ② 把脈衝加寬，看高次梳齒先塌掉：脈衝越短頻寬越寬，飛秒脈衝的梳齒到 2f 根本還是平的。
    ③ 在預設 f<sub>rep</sub> = 40 MHz 下切換兩個 NADH 預設，看兩態相位差怎麼從 1f 的 26° 拉開到 2f 的 40°——
    訊號虧 1.4 倍，換對比多一倍（這組數字跟著 f<sub>rep</sub> 變，即時值看 stats）。`,
},
en: {
  'title': 'Pulse Train ↔ Frequency Comb',
  'doc.title': 'Pulse Train ↔ Frequency Comb 🦉',
  'btn.lang.title': '切換成中文',
  'btn.theme.title': 'Toggle dark / light',
  'theme.light': '☀ Light', 'theme.dark': '🌙 Dark',
  'sub': `A pulse train with period <code>T</code> ⇔ a frequency comb with spacing <code>1/T</code>. Top left: the time-domain pulse train and
    how “stacking harmonics grows a sharp pulse”; bottom left: the comb teeth, the fluorescence-lifetime low-pass
    <code>m = 1/√(1+(2πfτ)²)</code>, and where 1f / 2f are sampled.
    Drag around: the sharper the pulse, the farther the comb reaches; the longer τ, the flatter the high-order teeth get squashed.`,
  'panel.time': 'Time domain: pulse train (blue) + first N harmonics summed (green)',
  'panel.freq': 'Frequency domain: comb (blue) × lifetime low-pass (orange) = what\'s heard (solid)',
  'lbl.frep': 'Repetition rate f<sub>rep</sub>',
  'lbl.wid': 'Pulse width (σ/T)',
  'lbl.nh': 'Harmonics summed N',
  'lbl.tau': 'Fluorescence lifetime τ',
  'preset.free': 'NADH free 0.4 ns',
  'preset.bound': 'NADH bound 2.5 ns',
  'preset.none': 'No lifetime (τ=0)',
  'stats': s =>
    `Comb teeth (laser) | <span class="g">1f</span>: <b>${s.c1}%</b>&ensp;<span class="p">2f</span>: <b>${s.c2}%</b><br>` +
    `<span class="o">Lifetime low-pass m</span> | <span class="g">1f</span>: <b>${s.m1}%</b>&ensp;<span class="p">2f</span>: <b>${s.m2}%</b>` +
    ` (loses <b>${s.loss}×</b>)<br>` +
    `Actually heard | <span class="g">1f</span>: <b>${s.h1}%</b>&ensp;<span class="p">2f</span>: <b>${s.h2}%</b><br>` +
    `Phase φ = arctan(2πfτ) | <span class="g">1f</span>: <b>${s.p1}°</b>&ensp;<span class="p">2f</span>: <b>${s.p2}°</b><br>` +
    `NADH phase gap | <span class="g">1f</span>: <b>${s.gap1}°</b> → <span class="p">2f</span>: <b>${s.gap2}°</b>`,
  'hint': `Tips: ① Pull N down to 1 and you get a pure sine; from about 8 it starts to look like a sharp pulse — “2f is the comb's built-in second tooth”.
    ② Widen the pulse and watch the high-order teeth collapse first: the shorter the pulse, the wider the bandwidth — a femtosecond pulse's comb is still dead flat out at 2f.
    ③ At the default f<sub>rep</sub> = 40 MHz, toggle between the two NADH presets and watch the phase gap between the two states open up from 26° at 1f to 40° at 2f —
    you lose 1.4× in signal but double the contrast (these numbers follow f<sub>rep</sub>; see the stats for live values).`,
},
};
let LANG = 'zh';
const t = (k, ...a) => { const v = (I18N[LANG][k] ?? I18N.zh[k]); return typeof v === 'function' ? v(...a) : (v ?? k); };

// ═══════════════════════════ 主題 / Theme ═══════════════════════════
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = {};
function readColors() {
  const map = { ink: '--ink', muted: '--muted', comb: '--comb', sum: '--sum',
                life: '--life', m1: '--mark1', m2: '--mark2', grid: '--grid' };
  for (const k in map) C[k] = css(map[k]);
}
let booted = false;
function redrawAll() { if (booted) render(); }   // 非 rAF 迴圈：切主題／語言後主動重畫
function setTheme(th) {
  document.documentElement.dataset.theme = th;
  try { localStorage.setItem('owl-theme', th); } catch (e) {}
  const b = document.getElementById('theme');
  if (b) b.textContent = th === 'dark' ? t('theme.light') : t('theme.dark');
  if (typeof readColors === 'function') readColors();
  if (typeof redrawAll === 'function') redrawAll();
}
(() => {
  let th = 'light'; try { th = localStorage.getItem('owl-theme') || th; } catch (e) {}
  const q = new URLSearchParams(location.search).get('theme');
  if (q === 'dark' || q === 'light') th = q;
  setTheme(th);
})();
document.getElementById('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

// ═══════════════════════════ 語言 / Language ═══════════════════════════
function applyLang() {
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-TW';
  document.title = t('doc.title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  $('lang').textContent = LANG === 'en' ? '中文' : 'EN';
  $('theme').textContent = document.documentElement.dataset.theme === 'dark' ? t('theme.light') : t('theme.dark');
  redrawAll();
}
function setLang(l) {
  LANG = l === 'en' ? 'en' : 'zh';
  try { localStorage.setItem('owl-lang', LANG); } catch (e) {}
  applyLang();
}
(() => {
  let l = 'zh'; try { l = localStorage.getItem('owl-lang') || l; } catch (e) {}
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'en' || q === 'zh') l = q;
  LANG = l;
})();
$('lang').onclick = () => setLang(LANG === 'en' ? 'zh' : 'en');

const tc = $('time').getContext('2d');
const fc = $('freq').getContext('2d');

// Gaussian pulse train, sigma as fraction of period: comb tooth n has c_n = exp(-2(pi n sigma/T)^2)
const tooth = (n, sig) => Math.exp(-2 * Math.PI * Math.PI * n * n * sig * sig);
const lowpass = (fMHz, tauNs) => 1 / Math.sqrt(1 + Math.pow(2 * Math.PI * fMHz * 1e6 * tauNs * 1e-9, 2));
const phaseDeg = (fMHz, tauNs) => Math.atan(2 * Math.PI * fMHz * 1e6 * tauNs * 1e-9) * 180 / Math.PI;

function drawTime(sig, N) {
  const w = 560, h = 230, mL = 10, mR = 10, mT = 12, mB = 20;
  const pw = w - mL - mR, ph = h - mT - mB;
  tc.clearRect(0, 0, w, h);
  const periods = 3;

  tc.strokeStyle = C.grid; tc.lineWidth = 1;
  tc.beginPath(); tc.moveTo(mL, mT + ph - 4); tc.lineTo(w - mR, mT + ph - 4); tc.stroke();
  tc.fillStyle = C.muted; tc.font = '11px sans-serif';
  for (let k = 0; k <= periods; k++) {
    const x = mL + pw * k / periods;
    tc.beginPath(); tc.moveTo(x, mT + ph - 4); tc.lineTo(x, mT + ph + 2); tc.stroke();
    tc.fillText(k + 'T', x - 6, h - 4);
  }

  const M = 900;
  // true pulse train (wrapped gaussians)
  let train = [], maxTrain = 0;
  for (let i = 0; i <= M; i++) {
    const t = i / M * periods;
    let v = 0;
    for (let k = -1; k <= periods + 1; k++) v += Math.exp(-Math.pow(t - k, 2) / (2 * sig * sig));
    train.push(v); if (v > maxTrain) maxTrain = v;
  }
  // partial harmonic sum: 1 + 2 sum c_n cos(2 pi n t)
  let sum = [], maxSum = 0, minSum = 1e9;
  for (let i = 0; i <= M; i++) {
    const t = i / M * periods;
    let v = 1;
    for (let n = 1; n <= N; n++) v += 2 * tooth(n, sig) * Math.cos(2 * Math.PI * n * t);
    sum.push(v); if (v > maxSum) maxSum = v; if (v < minSum) minSum = v;
  }

  const trace = (arr, lo, hi, color, lw) => {
    tc.strokeStyle = color; tc.lineWidth = lw; tc.beginPath();
    arr.forEach((v, i) => {
      const x = mL + pw * i / M;
      const y = mT + (ph - 8) * (1 - (v - lo) / (hi - lo)) + 4;
      i ? tc.lineTo(x, y) : tc.moveTo(x, y);
    });
    tc.stroke();
  };
  trace(train, 0, maxTrain, C.comb, 2.5);
  trace(sum, Math.min(minSum, 0), maxSum, C.sum, 1.5);
}

function drawFreq(frep, sig, tau, N) {
  const w = 560, h = 250, mL = 34, mR = 10, mT = 14, mB = 30;
  const pw = w - mL - mR, ph = h - mT - mB;
  fc.clearRect(0, 0, w, h);
  const fMax = Math.max(340, frep * 4.2);
  const X = f => mL + pw * f / fMax;
  const Y = v => mT + ph * (1 - v);

  fc.strokeStyle = C.grid; fc.lineWidth = 1;
  fc.beginPath(); fc.moveTo(mL, Y(0)); fc.lineTo(w - mR, Y(0)); fc.stroke();
  fc.fillStyle = C.muted; fc.font = '11px sans-serif';
  for (let f = 0; f <= fMax; f += 80) {
    fc.beginPath(); fc.moveTo(X(f), Y(0)); fc.lineTo(X(f), Y(0) + 4); fc.stroke();
    fc.fillText(f, X(f) - 8, h - 14);
  }
  fc.fillText('MHz', w - 34, h - 2);

  // lifetime low-pass curve
  fc.strokeStyle = C.life; fc.lineWidth = 1.8; fc.setLineDash([5, 4]); fc.beginPath();
  for (let i = 0; i <= 300; i++) {
    const f = i / 300 * fMax;
    const y = Y(lowpass(f, tau));
    i ? fc.lineTo(X(f), y) : fc.moveTo(X(f), y);
  }
  fc.stroke(); fc.setLineDash([]);

  // comb teeth: outline = laser comb, filled = after lifetime low-pass
  const nMax = Math.floor(fMax / frep);
  for (let n = 1; n <= nMax; n++) {
    const f = n * frep, x = X(f);
    const cn = tooth(n, sig);
    const heard = cn * lowpass(f, tau);
    const isMark = (n === 1 || n === 2);
    const col = n === 1 ? C.m1 : n === 2 ? C.m2 : C.comb;
    fc.strokeStyle = col; fc.lineWidth = isMark ? 2.5 : 1.5;
    fc.globalAlpha = 0.35;
    fc.beginPath(); fc.moveTo(x, Y(0)); fc.lineTo(x, Y(cn)); fc.stroke();
    fc.globalAlpha = 1;
    fc.beginPath(); fc.moveTo(x, Y(0)); fc.lineTo(x, Y(heard)); fc.stroke();
    fc.beginPath(); fc.arc(x, Y(heard), isMark ? 3.5 : 2.2, 0, 2 * Math.PI);
    fc.fillStyle = col; fc.fill();
    if (isMark) {
      fc.fillStyle = col;
      fc.fillText(n === 1 ? '1f' : '2f', x - 6, Y(cn) - 8);
    }
  }
  // N-harmonics bracket
  if (N * frep < fMax) {
    fc.strokeStyle = C.sum; fc.globalAlpha = 0.5; fc.setLineDash([2, 4]);
    fc.beginPath(); fc.moveTo(X(N * frep + frep / 2), mT); fc.lineTo(X(N * frep + frep / 2), Y(0)); fc.stroke();
    fc.setLineDash([]); fc.globalAlpha = 1;
    fc.fillStyle = C.sum; fc.fillText('N=' + N, X(N * frep + frep / 2) + 4, mT + 10);
  }
}

function stats(frep, sig, tau) {
  const c1 = tooth(1, sig), c2 = tooth(2, sig);
  const m1 = lowpass(frep, tau), m2 = lowpass(2 * frep, tau);
  const h1 = c1 * m1, h2 = c2 * m2;
  const p1 = phaseDeg(frep, tau), p2 = phaseDeg(2 * frep, tau);
  // NADH reference gap at current frep
  const gap1 = phaseDeg(frep, 2.5) - phaseDeg(frep, 0.4);
  const gap2 = phaseDeg(2 * frep, 2.5) - phaseDeg(2 * frep, 0.4);
  $('stats').innerHTML = t('stats', {
    c1: (c1 * 100).toFixed(1), c2: (c2 * 100).toFixed(1),
    m1: (m1 * 100).toFixed(0), m2: (m2 * 100).toFixed(0),
    loss: m2 > 1e-6 ? (m1 / m2).toFixed(2) : '∞',
    h1: (h1 * 100).toFixed(1), h2: (h2 * 100).toFixed(1),
    p1: p1.toFixed(1), p2: p2.toFixed(1),
    gap1: gap1.toFixed(0), gap2: gap2.toFixed(0),
  });
}

function render() {
  const frep = parseFloat($('frep').value);
  const sig = parseFloat($('wid').value) / 100;
  const N = parseInt($('nh').value);
  const tau = parseFloat($('tau').value);
  $('frepOut').textContent = frep + ' MHz';
  $('widOut').textContent = (sig * 100).toFixed(1) + '%';
  $('nOut').textContent = N;
  $('tauOut').textContent = tau.toFixed(2) + ' ns';
  drawTime(sig, N);
  drawFreq(frep, sig, tau, N);
  stats(frep, sig, tau);
}

['frep', 'wid', 'nh', 'tau'].forEach(id => $(id).addEventListener('input', render));
document.querySelectorAll('.presets button').forEach(b =>
  b.addEventListener('click', () => { $('tau').value = b.dataset.tau; render(); }));

applyLang();
render();
booted = true;
</script>
</body>
</html>
